<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08150e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Motus</title>
<style>
:root{
  --bg:#08150e; --surface:#0f2218; --surface2:#15301f; --line:#22412d;
  --moss:#1d5a3a; --moss-hi:#247049; --moss-lo:#0c3322; --moss-text:#f2c46e;
  --gold:#fdbd4a; --gold-hi:#fed775; --sky:#156c83; --sky-deep:#0a3346; --on-gold:#1a2a12;
  --text:#f1ece0; --muted:#9aa89c; --danger:#c8614f;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--sky-deep) 0,#0a2a2c 160px,var(--bg) 420px) no-repeat,var(--bg);}
html,body{color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--moss-hi)}
.wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 20px calc(16px + env(safe-area-inset-left))}
.wrap.wide{max-width:1240px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.date{color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted)}
h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.timer{background:radial-gradient(90% 120% at 82% 18%,rgba(253,189,74,.38),transparent 55%),linear-gradient(170deg,var(--sky) 0%,#13503f 55%,var(--moss-lo) 100%);border:0;padding:18px;display:flex;align-items:center;gap:14px}
.timer .t{font-variant-numeric:tabular-nums;font-size:32px;font-weight:700;letter-spacing:-.02em}
.timer .lbl{font-size:13px;color:#f3e3bf;opacity:.9}
.timer .grow{flex:1;min-width:0}
.timer.idle{background:var(--surface);border:1px dashed var(--line)}
.timer.idle .t{color:var(--muted)}
.btn{background:var(--moss);color:#f6f1e4;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--moss-hi)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger)}
.btn.stop{background:var(--gold);color:var(--on-gold)}
.btn.stop:hover{background:var(--gold-hi)}
.btn.sm{padding:7px 11px;font-size:13px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none}
.icon:hover{background:var(--line)}
.icon.play{background:var(--moss);color:#fff}
.icon.on{background:var(--gold);color:var(--on-gold)}
.icon.xs{width:26px;height:26px;border-radius:7px}
.goal-h{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.goal-h .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-h .today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tasks{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px}
.task:hover{background:var(--surface2)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.chk.done{background:var(--gold);border-color:var(--gold)}
.task .tt{flex:1;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .meta{font-size:12px;color:var(--muted)}
.task .icon{width:30px;height:30px;border-radius:8px}
.add-task{display:flex;gap:8px;margin-top:8px}
.add-task input{padding:8px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px}
.weekchart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:12px}
.weekchart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekchart .stack{width:100%;max-width:34px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--surface2);min-height:3px}
.weekchart .d{font-size:11px;color:var(--muted)}
.weekchart .d.now{color:var(--moss-text);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.empty .btn{margin-top:14px}
.collapse{font-size:13px;color:var(--muted);padding:6px 4px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.navbtns{display:flex;gap:6px;align-items:center}
.navbtns .lbl{color:var(--muted);font-size:14px;margin-right:6px}

/* Woche */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:340px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.daycol.past{opacity:.6}
.daycol.now{border-color:var(--gold)}
.dayhead{display:flex;align-items:baseline;gap:6px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.dayhead b{font-size:15px}
.dayhead span{color:var(--muted);font-size:13px}
.dayhead .sum{margin-left:auto;font-size:12px}
.daycol.now .dayhead b,.daycol.now .dayhead span:first-of-type{color:var(--moss-text)}
.add-day{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:6px}
.add-day input,.add-day select{padding:7px 9px;font-size:13px;border-radius:8px;background:transparent;border-color:transparent}
.add-day select{color:var(--muted)}
.add-day input:focus{background:var(--surface2)}
.tcard{background:var(--surface2);border:1px solid var(--line);border-left:3px solid;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.tcard .title{font-size:14px;line-height:1.35}
.tcard.done .title{text-decoration:line-through;color:var(--muted)}
.tcard.done{opacity:.65}
.tcard .foot{display:flex;align-items:center;gap:4px;min-width:0}
.daycol{min-width:0}
.tcard .chk{width:20px;height:20px;border-radius:6px}
.chip{display:inline-flex;min-width:0;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip i{width:6px;height:6px;border-radius:50%;flex:none}
.tcard .sp{flex:1}
.tcard .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tcard.running{border-color:var(--gold)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left}
.cell:hover{border-color:var(--moss)}
.cell .n{font-size:13px;font-weight:600}
.cell .m{font-size:10.5px;color:var(--moss-text);font-variant-numeric:tabular-nums}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.cell.today .n{color:var(--moss-text)}
.cell.sel{border-color:var(--gold);background:var(--surface2)}
.cell.blank{background:transparent;border:0}
.cell.future{opacity:.55}
@media(min-width:700px){.cell{min-height:88px}.cell .m{font-size:12px}}
.sess{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border-bottom:0}
.sess .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:94px}

/* Fokus */
.focus{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.ring{position:relative;width:260px;height:260px;margin:8px auto 18px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ring .sub{font-size:13px;color:var(--muted);margin-top:4px;max-width:180px}
.durs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.durs button{padding:9px 16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.durs button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.focus-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:left}
.focus-form label{font-size:13px;color:var(--muted);margin-bottom:-4px}

/* Rückblick */
.review label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.review label:first-child{margin-top:0}
.trend{font-size:12px;margin-top:4px}
.up{color:var(--moss-text)} .down{color:#d9a07a}
.donelist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.donelist div{display:flex;gap:8px;align-items:center;font-size:14px}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,21,14,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;gap:2px;max-width:720px;width:100%}
nav button{flex:1;padding:7px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);min-width:0}
nav button.on{color:var(--moss-text);background:var(--surface)}
@media(min-width:820px){
  body{padding-bottom:30px;padding-top:62px}
  nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:10px 16px}
  nav .in{max-width:1240px;justify-content:center}
  nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 14px}
  nav button svg{width:16px;height:16px}
}
@media(min-width:1100px){.board{grid-auto-columns:minmax(150px,1fr);overflow-x:visible}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:440px}
@media(min-width:600px){.modal{border-radius:18px}}
.modal h3{font-size:18px;margin-bottom:14px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.modal .actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.modal .actions .sp{flex:1}

/* ---- v2: Prinzipien ---- */
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid;border-radius:12px;padding:9px 10px}
.qitem.first{border-color:var(--gold);box-shadow:0 0 0 1px rgba(253,189,74,.25)}
.qitem .tt{flex:1;min-width:0}
.qitem .tt .t1{font-size:15px;line-height:1.35}
.qitem .tt .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qitem .ord{display:flex;flex-direction:column;gap:2px}
.qitem .ord button{width:24px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.qitem .ord button:hover{background:var(--surface2);color:var(--text)}
.qitem.drag,.tcard.drag{opacity:.4}
.dropline{height:3px;border-radius:2px;background:var(--gold);margin:-2px 0}
.addbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addbar input{flex:1 1 180px}
.addbar select{flex:0 1 170px;width:auto}
.donelog{display:flex;flex-direction:column;gap:2px}
.donelog .d{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px}
.donelog .d .tt{flex:1;min-width:0}
.donelog .d .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.done-head{display:flex;align-items:baseline;justify-content:space-between}
.done-head .big{font-size:22px;font-weight:700;color:var(--gold)}
.qh{display:flex;flex-direction:column;gap:10px}
.qh .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.qh .r .bar{grid-column:1/3;margin-top:2px;height:6px}
.qh .r .n{display:flex;align-items:center;gap:8px;min-width:0}
.qh .r .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qh .r .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.other-toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:10px 4px}

/* Fokus v2 */
.fx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px}
.fx .ftitle{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:10px 0 4px;max-width:520px}
.fx .fclock{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0}
.fx .fclock.paused{color:var(--muted)}
.fx .fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.fx .fbtns .btn{padding:13px 20px;font-size:15px}
.fx textarea{max-width:520px;margin-top:14px;min-height:90px;text-align:left}
.fx .left{font-size:13px;color:var(--muted);margin-top:10px}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold-hi)}

/* Logbuch */
.tl-wrap{overflow-x:auto;padding-bottom:8px}
.tl{display:grid;grid-template-columns:40px repeat(7,minmax(118px,1fr));min-width:880px}
@media(min-width:1100px){.tl{min-width:0}}
.tl .hd{padding:6px 6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.tl .hd b{font-size:14px}
.tl .hd .s{font-size:11px;color:var(--muted);margin-top:2px}
.tl .hd.now b{color:var(--gold)}
.tl .hours{position:relative}
.tl .hours div{position:absolute;right:6px;font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.tl .col{position:relative;border-left:1px solid var(--line)}
.tl .col.now{background:rgba(253,189,74,.04)}
.tl .blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden;color:#0b1a10;font-weight:600}
.tl .blk.live{box-shadow:0 0 0 2px var(--gold)}
.tl .blk span{display:block;font-weight:400;opacity:.85}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 4px}
.legend span{display:flex;align-items:center;gap:6px}

/* Kompass */
.compass label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.compass label:first-of-type{margin-top:4px}
.compass textarea{min-height:46px}
.hint{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px;margin-bottom:12px}

/* Wiki */
.hbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-weight:700;color:var(--gold);flex:none}
.hbtn:hover{background:var(--line)}
.hbtn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.wiki{line-height:1.6}
.wiki .lead{font-size:16px;color:var(--text);margin-bottom:14px}
.wiki p{margin:8px 0;color:#d9dccf}
.wiki h3{font-size:17px;margin:2px 0 6px;letter-spacing:-.01em}
.wiki ul,.wiki ol{margin:6px 0 6px 20px;color:#d9dccf}
.wiki li{margin:4px 0}
.wiki b{color:var(--text)}
.wiki .where{font-size:13px;color:var(--gold);margin-top:6px}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.toc button{font-size:13px;padding:7px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.toc button:hover{border-color:var(--gold)}
.pr{display:flex;gap:12px}
.pr .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.wiki details{border-bottom:1px solid var(--line);padding:10px 0}
.wiki details:last-child{border-bottom:0}
.wiki summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.wiki summary::-webkit-details-marker{display:none}
.wiki summary::after{content:'+';color:var(--gold);font-weight:700}
.wiki details[open] summary::after{content:'–'}
.wiki dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:8px 14px;margin:4px 0}
.wiki dt{font-weight:600;color:var(--text)}
.wiki dd{color:#d9dccf}
@media(max-width:480px){.wiki dl{grid-template-columns:1fr}.wiki dd{margin-bottom:6px}}
.totop{font-size:12px;color:var(--muted);margin-top:8px;display:inline-block}
</style>
</head>
<body>
<nav><div class="in">
  <button data-tab="heute"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Heute</button>
  <button data-tab="woche"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Woche</button>
  <button data-tab="fokus"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Fokus</button>
  <button data-tab="logbuch"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h4"/></svg>Logbuch</button>
  <button data-tab="ziele"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Ziele</button>

    <div class="row" style="gap:12px"><div style="text-align:right"><div class="date" id="today-label"></div><div class="sync" id="sync"></div></div><button class="hbtn" data-a="tab" data-tab="hilfe" title="Anleitung">?</button></div>

  <main id="view"></main>

<div id="modal-root"></div>

<script>
// ================= Grundlagen =================
const COLORS=['#fdbd4a','#2f8f5b','#2b8aa6','#8aa65a','#c77d4a','#b85c5c','#8a6bb5','#4aa38f'];
const NONE={id:'_none',name:'Ohne Ziel',color:'#7f8c84'};
const TABS=['heute','woche','fokus','logbuch','ziele','rueckblick','hilfe'];
const CLIENT=Math.random().toString(36).slice(2,9);
const EMPTY=()=>({goals:[],tasks:[],log:{},running:null,sessions:[],reviews:{},compass:{}});
let S=EMPTY();
let tab='heute';
try{const h=location.hash.slice(1);if(h==='kalender')tab='logbuch';else if(TABS.includes(h))tab=h;}catch(e){}
let weekOff=0,logOff=0,revOff=0,lastGoal=null,showOther=false,pendingRender=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dkey(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const shiftKey=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);};
function weekOf(off){const n=new Date();const o=(n.getDay()+6)%7;const out=[];for(let i=0;i<7;i++)out.push(new Date(n.getFullYear(),n.getMonth(),n.getDate()-o+i+off*7));return out;}
function fmtClock(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600);return (h?h+':'+pad(Math.floor(s%3600/60)):Math.floor(s%3600/60))+':'+pad(s%60);}
function fmtDur(s){s=Math.round(s/60);if(s<60)return s+' min';const h=Math.floor(s/60),m=s%60;return m?h+' h '+m+' min':h+' h';}
function fmtShort(s){const m=Math.round(s/60);if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?h+'h '+r:h+'h';}
const fmtTime=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());};
const goal=id=>id==='_none'?NONE:S.goals.find(g=>g.id===id);
const activeGoals=()=>S.goals.filter(g=>!g.archived);
const isGoalTask=t=>t.goalId!=='_none'&&!!S.goals.find(g=>g.id===t.goalId);
const rangeLabel=days=>{const a=days[0],b=days[6];return a.getDate()+'.'+(a.getMonth()+1)+'. – '+b.getDate()+'.'+(b.getMonth()+1)+'.'+b.getFullYear();};
const wdShort=d=>d.toLocaleDateString('de-DE',{weekday:'short'}).replace('.','');
const byOrder=(a,b)=>(a.order||0)-(b.order||0);

// ================= Zeit =================
function runningSecs(){return S.running?(Date.now()-S.running.start)/1000:0;}
function secsOn(goalId,day){let v=(S.log[goalId]||{})[day]||0;if(S.running&&S.running.goalId===goalId){const s0=parseKey(day).getTime(),s1=s0+86400000;const a=Math.max(S.running.start,s0),b=Math.min(Date.now(),s1);if(b>a)v+=(b-a)/1000;}return v;}
const goalSecs=day=>S.goals.reduce((a,g)=>a+secsOn(g.id,day),0);
const allSecs=day=>goalSecs(day)+secsOn('_none',day);
function totalSecs(goalId){let v=Object.values(S.log[goalId]||{}).reduce((a,b)=>a+b,0);if(S.running&&S.running.goalId===goalId)v+=runningSecs();return v;}
const taskSecs=t=>(t.secs||0)+(S.running&&S.running.taskId===t.id?runningSecs():0);
function addTime(goalId,startMs,endMs){
  S.log[goalId]=S.log[goalId]||{};
  let t=startMs;
  while(t<endMs){const d=new Date(t);const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const e=Math.min(next,endMs);const k=dkey(d);S.log[goalId][k]=Math.round((S.log[goalId][k]||0)+(e-t)/1000);t=e;}
}
function startTimer(taskId){
  const t=S.tasks.find(x=>x.id===taskId);if(!t)return;
  if(S.running)stopTimer(true);
  S.running={goalId:t.goalId,taskId:t.id,start:Date.now()};
  save();render();
}
function stopTimer(silent){
  const r=S.running;if(!r)return;
  const end=Date.now();
  if(end-r.start>=1000){
    addTime(r.goalId,r.start,end);
    if(r.taskId){const t=S.tasks.find(x=>x.id===r.taskId);if(t)t.secs=Math.round((t.secs||0)+(end-r.start)/1000);}
    S.sessions.push({g:r.goalId,t:r.taskId,s:r.start,e:end});
  }
  S.running=null;
  if(!silent){save();render();}
}
function completeTask(id,autoNext){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const wasRunning=S.running&&S.running.taskId===id;
  if(wasRunning)stopTimer(true);
  t.done=true;t.doneOn=todayKey();t.doneAt=Date.now();
  if(autoNext&&wasRunning){const n=focusQueue()[0];if(n){S.running={goalId:n.goalId,taskId:n.id,start:Date.now()};}}
  save();render();
}
function reopenTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=false;t.doneOn=null;t.doneAt=null;if(t.date<todayKey())t.date=todayKey();t.order=nextOrder(t.date);save();render();}

// ================= Reihenfolge =================
function dayTasks(k){const tk=todayKey();return S.tasks.filter(t=>!t.done&&goal(t.goalId)&&(k===tk?t.date<=tk:t.date===k)).sort(byOrder);}
function focusQueue(){const q=dayTasks(todayKey());return [...q.filter(isGoalTask),...q.filter(t=>!isGoalTask(t))];}
function nextOrder(k){const l=S.tasks.filter(t=>t.date===k||(k===todayKey()&&t.date<k&&!t.done));return l.length?Math.max(...l.map(t=>t.order||0))+1:Date.now();}
function moveInList(id,dir,list){const i=list.findIndex(t=>t.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;const a=list[i],b=list[j];let oa=a.order||0,ob=b.order||0;if(oa===ob)ob=oa+dir;a.order=ob;b.order=oa;save();render();}
function placeTask(id,dayKey,beforeId){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.date=dayKey;
  const list=(dayKey===todayKey()?dayTasks(dayKey):S.tasks.filter(x=>x.date===dayKey&&!x.done).sort(byOrder)).filter(x=>x.id!==id);
  if(!beforeId){t.order=list.length?(list[list.length-1].order||0)+1:Date.now();}
  else{const i=list.findIndex(x=>x.id===beforeId);const nxt=list[i],prv=list[i-1];t.order=prv?((prv.order||0)+(nxt.order||0))/2:(nxt.order||0)-1;}
  save();render();
}

// ================= Speichern =================
let ref=null,saveTimer=null,writing=Promise.resolve(),lastRev=null;
function normalize(o){const s=Object.assign(EMPTY(),o||{});s.tasks.forEach((t,i)=>{if(!t.goalId)t.goalId='_none';if(t.order==null)t.order=i;});return s;}
function localLoad(){try{const v=localStorage.getItem('motus');if(v)S=normalize(JSON.parse(v));}catch(e){}}
function localSave(){try{localStorage.setItem('motus',JSON.stringify(S));}catch(e){}}
function save(){
  localSave();markDirty();
  if(!ref)return;
  clearTimeout(saveTimer);
  setSync('Speichert…');
  saveTimer=setTimeout(()=>{
    saveTimer=null;
    const rev=Date.now()+'-'+CLIENT;lastRev=rev;
    const body={rev,state:JSON.parse(JSON.stringify(S))};
    writing=writing.then(()=>ref.set(body)).then(()=>setSync('Gespeichert')).catch(e=>{setSync(e&&e.code==='quota_exceeded'?'Speicher voll':'Nicht gespeichert');});
  },700);
}
function setSync(t){$('#sync').textContent=t;}
function prune(){
  const lim=new Date();lim.setDate(lim.getDate()-90);const lk=dkey(lim);
  S.tasks=S.tasks.filter(t=>!(t.done&&(t.doneOn||t.date)<lk));
  const sl=Date.now()-180*86400000;S.sessions=S.sessions.filter(x=>x.e>sl);
  if(S.running&&S.running.plan)S.running.plan=null;
}
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='file'));};
function softRender(){if(typing())pendingRender=true;else render();}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render();}},150));
async function initStore(){
  localLoad();prune();render();setSync(NOSYNC);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
const NOSYNC='Auf diesem Gerät gespeichert';

// ================= Bausteine =================
const I={
  play:()=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>`,
  pause:()=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>`,
  check:(w=12)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="#1a2a12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>`,
  x:()=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  chev:d=>`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'}"/></svg>`,
  up:()=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`,
  down:()=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
  undo:()=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>`
};

function viewLog(){
  const days=weekOf(logOff),tk=todayKey(),keys=days.map(dkey);
  const now=Date.now();
  const ses=[...S.sessions];
  if(S.running)ses.push({g:S.running.goalId,t:S.running.taskId,s:S.running.start,e:now,live:true});
  const perDay=keys.map(k=>{const s0=parseKey(k).getTime(),s1=s0+86400000;return ses.filter(x=>x.e>s0&&x.s<s1).map(x=>({...x,a:Math.max(x.s,s0),b:Math.min(x.e,s1),s0}));});
  let h0=8,h1=20;
  perDay.flat().forEach(x=>{const a=(x.a-x.s0)/3600000,b=(x.b-x.s0)/3600000;h0=Math.min(h0,Math.floor(a));h1=Math.max(h1,Math.ceil(b));});

  days.forEach((d,i)=>{const k=keys[i];const dn=S.tasks.filter(t=>t.done&&t.doneOn===k).length;const qs=goalSecs(k),al=allSecs(k);
    h+=`<div class="hd ${k===tk?'now':''}"><b>${wdShort(d)} ${d.getDate()}.</b><div class="s">${al>=60?fmtShort(qs)+' Ziele':'–'}${al-qs>=60?' · '+fmtShort(al-qs)+' sonst.':''}${dn?' · '+dn+' ✓':''}</div></div>`;});
  h+=`<div class="hours" style="height:${H}px">${Array.from({length:h1-h0+1},(_,i)=>`<div style="top:${i*PX}px">${pad(h0+i)}</div>`).join('')}</div>`;
  perDay.forEach((list,i)=>{
    h+=`<div class="col ${keys[i]===tk?'now':''}" style="height:${H}px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ${PX-1}px,var(--line) ${PX-1}px,var(--line) ${PX}px)">`;
    list.forEach(x=>{const g=goal(x.g)||NONE,t=S.tasks.find(y=>y.id===x.t);const top=((x.a-x.s0)/3600000-h0)*PX,ht=Math.max(3,(x.b-x.a)/3600000*PX);
      h+=`<div class="blk ${x.live?'live':''}" style="top:${top}px;height:${ht}px;background:${g.color}" title="${fmtTime(x.s)}–${x.live?'jetzt':fmtTime(x.e)} · ${esc(t?t.title:g.name)}">${ht>=22?esc(t?t.title:g.name):''}${ht>=40?`<span>${fmtTime(x.s)}–${x.live?'jetzt':fmtTime(x.e)}</span>`:''}</div>`;});
    h+='</div>';
  });
  h+='</div></div>';
  const used=[...new Set(perDay.flat().map(x=>x.g))].map(goal).filter(Boolean);
  if(used.length)h+=`<div class="legend">${used.map(g=>`<span><i class="dot" style="background:${g.color}"></i>${esc(g.name)}</span>`).join('')}</div>`;
  const done=S.tasks.filter(t=>t.done&&keys.includes(t.doneOn)).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  h+=`<h2>Erledigt diese Woche · ${done.length}</h2><div class="card">${done.length?`<div class="donelog">${done.map(t=>{const g=goal(t.goalId)||NONE;return `<div class="d"><span class="chk done" style="width:20px;height:20px;border-radius:6px">${I.check(11)}</span><div class="tt">${esc(t.title)} <span class="small">· ${wdShort(parseKey(t.doneOn))}</span></div><span class="dot" style="background:${g.color}"></span><span class="tm">${t.secs>=60?fmtShort(t.secs):''}</span></div>`;}).join('')}</div>`:'<div class="small">In dieser Woche noch nichts abgehakt.</div>'}</div>`;
  return h;
}

// ---- Dropbox (OAuth mit PKCE, nur App-Ordner) ----
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function dbxStartAuth(appKey){
  const v=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  localStorage.setItem('motus_pkce',JSON.stringify({v,appKey}));
  const u=new URL('https://www.dropbox.com/oauth2/authorize');
  Object.entries({client_id:appKey,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:redirectUri(),token_access_type:'offline'}).forEach(([k,x])=>u.searchParams.set(k,x));
  location.href=u.toString();
}
async function dbxToken(params){
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});
  if(!r.ok)throw new Error('Anmeldung bei Dropbox fehlgeschlagen ('+r.status+')');
  return r.json();
}
async function dbxFinishAuth(){
  const q=new URLSearchParams(location.search);
  if(!q.has('code')&&!q.has('error'))return false;
  history.replaceState(null,'',location.pathname+location.hash);
  if(q.has('error')){SY.err='Dropbox-Anmeldung abgebrochen';return true;}
  let p;try{p=JSON.parse(localStorage.getItem('motus_pkce')||'null');}catch(e){}
  if(!p)return true;
  localStorage.removeItem('motus_pkce');
  const t=await dbxToken({grant_type:'authorization_code',code:q.get('code'),client_id:p.appKey,code_verifier:p.v,redirect_uri:redirectUri()});
  SY.cfg={type:'dropbox',appKey:p.appKey,refresh:t.refresh_token,access:t.access_token,exp:Date.now()+(t.expires_in-60)*1000};
  saveCfg();return true;
}
async function dbxAccess(){
  const c=SY.cfg;
  if(c.access&&c.exp>Date.now())return c.access;
  const t=await dbxToken({grant_type:'refresh_token',refresh_token:c.refresh,client_id:c.appKey});
  c.access=t.access_token;c.exp=Date.now()+(t.expires_in-60)*1000;saveCfg();return c.access;
}
const DROPBOX={
  async get(){
    const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await dbxAccess(),'Dropbox-API-Arg':JSON.stringify({path:FILE})}});
    if(r.status===409)return null;
    if(!r.ok)throw new Error('Dropbox: Laden fehlgeschlagen ('+r.status+')');
    return JSON.parse(await r.text());
  },
  async put(text){
    const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await dbxAccess(),'Dropbox-API-Arg':JSON.stringify({path:FILE,mode:'overwrite',mute:true}),'Content-Type':'application/octet-stream'},body:text});
    if(!r.ok)throw new Error('Dropbox: Speichern fehlgeschlagen ('+r.status+')');
  }
};

// ---- WebDAV ----
const davHeaders=()=>{const c=SY.cfg;const h={};if(c.user)h.Authorization='Basic '+btoa(unescape(encodeURIComponent(c.user+':'+(c.pass||''))));return h;};
const davUrl=()=>{const u=SY.cfg.url.trim();return /\.json$/i.test(u)?u:u.replace(/\/?$/,'/')+'motus.json';};
const WEBDAV={
  async get(){
    const r=await fetch(davUrl()+(davUrl().includes('?')?'&':'?')+'t='+Date.now(),{headers:davHeaders(),cache:'no-store'});
    if(r.status===404)return null;
    if(!r.ok)throw new Error('WebDAV: Laden fehlgeschlagen ('+r.status+')');
    const tx=await r.text();return tx.trim()?JSON.parse(tx):null;
  },
  async put(text){
    const r=await fetch(davUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},davHeaders()),body:text});
    if(!r.ok)throw new Error('WebDAV: Speichern fehlgeschlagen ('+r.status+')');
  }
};
const provider=()=>SY.cfg.type==='dropbox'?DROPBOX:SY.cfg.type==='webdav'?WEBDAV:null;
function errText(e){const m=String(e&&e.message||e);if(/\((401|403)\)/.test(m))return 'Zugriff verweigert. Benutzer oder Passwort stimmen nicht.';if(/Failed to fetch|NetworkError|Load failed/i.test(m))return SY.cfg.type==='webdav'?'Keine Verbindung. Entweder ist der Server nicht erreichbar, oder er blockiert Zugriffe aus dem Browser (CORS).':'Keine Verbindung zum Internet.';return m;}

// ---- Abgleich: die neuere Version gewinnt ----
async function syncPull(){
  const p=provider();if(!p||SY.busy)return;
  SY.busy=true;SY.err=null;showSync();
  try{
    const remote=await p.get();
    const mine=localStamp();
    const hasLocal=S.goals.length||S.tasks.length;
    if(!SY.cfg.synced&&remote&&remote.state&&hasLocal&&(remote.state.goals||[]).length){
      SY.busy=false;showSync();
      SY.pendingRemote=remote;
      modal(`<h3>Welche Daten behalten?</h3><div class="small">In ${provName()} liegen schon Motus-Daten (${remote.state.goals.length} Ziele, ${(remote.state.tasks||[]).length} Aufgaben), und auf diesem Gerät auch (${S.goals.length} Ziele, ${S.tasks.length} Aufgaben). Welche sollen ab jetzt gelten?</div><div class="actions"><button class="btn ghost" data-a="sync-keep-local">Dieses Gerät</button><span class="sp"></span><button class="btn" data-a="sync-keep-remote">Aus ${provName()}</button></div>`);
      return;
    }
    if(remote&&remote.state&&(remote.savedAt||0)>mine){
      S=normalize(remote.state);localSave();setStamp(remote.savedAt);softRender();
    }else if(!remote||(remote.savedAt||0)<mine){
      await p.put(JSON.stringify({app:'motus',v:2,savedAt:mine||Date.now(),state:S}));
      if(!mine)setStamp(Date.now());
    }
    SY.last=Date.now();if(!SY.cfg.synced){SY.cfg.synced=true;saveCfg();}
  }catch(e){SY.err=errText(e);}
  SY.busy=false;showSync();if(tab==='ziele'&&!typing())render();
}
async function syncPush(){
  const p=provider();if(!p)return;
  if(SY.busy){schedulePush();return;}
  SY.busy=true;SY.err=null;showSync();
  try{await p.put(JSON.stringify({app:'motus',v:2,savedAt:localStamp(),state:S}));SY.last=Date.now();}
  catch(e){SY.err=errText(e);}
  SY.busy=false;showSync();
}
function schedulePush(){if(SY.cfg.type==='none')return;clearTimeout(SY.timer);SY.timer=setTimeout(syncPush,2000);}
function markDirty(){setStamp(Date.now());schedulePush();}
async function syncInit(){
  try{await dbxFinishAuth();}catch(e){SY.err=errText(e);}
  showSync();
  if(SY.cfg.type!=='none')syncPull();
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SY.timer){clearTimeout(SY.timer);syncPush();}}else syncPull();});
  window.addEventListener('online',syncPull);
  setInterval(()=>{if(!document.hidden&&!SY.timer)syncPull();},120000);
}

// ================= Rückblick =================
function viewReview(){
  const days=weekOf(revOff),prev=weekOf(revOff-1),tk=todayKey(),wk=dkey(days[0]),keys=days.map(dkey);
  const goals=S.goals.filter(g=>!g.archived||keys.some(k=>secsOn(g.id,k)>0));
  const qW=keys.reduce((a,k)=>a+goalSecs(k),0),qP=prev.map(dkey).reduce((a,k)=>a+goalSecs(k),0);
  const oW=keys.reduce((a,k)=>a+secsOn('_none',k),0);
  const doneT=S.tasks.filter(t=>t.done&&keys.includes(t.doneOn));
  const tgtSum=goals.filter(g=>!g.archived).reduce((a,g)=>a+(g.target||0),0)*3600;
  const diff=qW-qP;
  let h=`<div class="pagehead"><h1>Rückblick</h1><div class="navbtns"><span class="lbl">${revOff===0?'Diese Woche':revOff===-1?'Letzte Woche':rangeLabel(days)}</span><button class="icon" data-a="rev" data-d="-1">${I.chev(-1)}</button><button class="btn ghost sm" data-a="rev" data-d="0">Aktuell</button><button class="icon" data-a="rev" data-d="1">${I.chev(1)}</button></div></div>`;
  h+=`<div class="hint">Dein festes Ritual: Nimm dir jede Woche 20 Minuten. Was lief gut, was nicht, und warum? Gemessen wird nur die Zeit, die in deine Ziele geflossen ist, also dein Input, nicht das Ergebnis.</div>`;
  h+=`<div class="stats"><div class="card stat"><div class="v" style="color:var(--gold)">${fmtShort(qW)}</div><div class="k">Ziel-Stunden${tgtSum?' von '+fmtShort(tgtSum):''}</div>${qP||qW?`<div class="trend ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${fmtShort(Math.abs(diff))} zur Vorwoche</div>`:''}</div><div class="card stat"><div class="v">${doneT.length}</div><div class="k">erledigt</div></div><div class="card stat"><div class="v">${fmtShort(oW)}</div><div class="k">Sonstiges</div></div></div>`;
  const per=days.map(d=>goals.map(g=>({g,s:secsOn(g.id,dkey(d))})));
  const max=Math.max(3600,...per.map(p=>p.reduce((a,x)=>a+x.s,0)));
  h+=`<div class="card"><div class="small">Ziel-Stunden pro Tag · ${rangeLabel(days)}</div><div class="weekchart">${days.map((d,i)=>{const tot=per[i].reduce((a,x)=>a+x.s,0);return `<div class="col"><div class="stack" style="height:${Math.max(3,tot/max*80)}px" title="${fmtDur(tot)}">${per[i].filter(x=>x.s>0).map(x=>`<i style="display:block;height:${x.s/tot*100}%;background:${x.g.color}"></i>`).join('')}</div><div class="d ${dkey(d)===tk?'now':''}">${wdShort(d)}</div></div>`;}).join('')}</div></div>`;
  h+='<h2>Input-Ziele</h2>';
  if(!goals.length)h+=`<div class="card empty">Noch keine Ziele.</div>`;
  for(const g of goals){const w=keys.reduce((a,k)=>a+secsOn(g.id,k),0);const tgt=(g.target||0)*3600;const dn=doneT.filter(t=>t.goalId===g.id).length;
    h+=`<div class="card"><div class="goal-h"><span class="dot" style="background:${g.color}"></span><span class="name">${esc(g.name)}</span><span class="today">${fmtDur(w)}${tgt?' / '+g.target+' h':''}</span></div>
    <div class="bar"><i style="width:${tgt?Math.min(100,w/tgt*100):(qW?w/qW*100:0)}%;background:${g.color}"></i></div>
    <div class="small" style="margin-top:8px">${tgt?(w>=tgt?'Input-Ziel erreicht 🎉':'Noch '+fmtDur(tgt-w)+' bis zum Input-Ziel'):'Kein Input-Ziel gesetzt'} · ${dn} erledigt</div></div>`;}
  const r=S.reviews[wk]||{};
  h+=`<h2>Reflexion</h2><div class="card review"><label>Was lief gut?</label><textarea data-review="good" data-w="${wk}" placeholder="Worauf bist du stolz?">${esc(r.good||'')}</textarea>
    <label>Was lief nicht gut, und warum?</label><textarea data-review="hard" data-w="${wk}" placeholder="Was hat dich gebremst?">${esc(r.hard||'')}</textarea>
    <label>Passt dein Alltag noch zu deinen Zielen?</label><textarea data-review="fit" data-w="${wk}" placeholder="Musst du deine Ziele ändern oder deinen Alltag?">${esc(r.fit||'')}</textarea>
    <label>Was verbesserst du nächste Woche?</label><textarea data-review="next" data-w="${wk}" placeholder="Ein, zwei konkrete Änderungen">${esc(r.next||'')}</textarea></div>`;
  return h;
}

      <li><b>Später</b> schiebt die Aufgabe ans Ende der Liste.</li>
      <li>Zuerst kommen die Aufgaben zu deinen Zielen, danach die ohne Ziel.</li></ul></details>
    <details><summary>Logbuch</summary><p>Ein Protokoll und kein Plan. Für jeden Tag der Woche siehst du als farbige Blöcke, wann du wirklich woran gearbeitet hast. Oben steht pro Tag, wie viele Ziel-Stunden und wie viel Sonstiges zusammengekommen sind und wie viele Aufgaben du erledigt hast. Darunter findest du alles, was du diese Woche geschafft hast.</p><p class="small">Nachgetragene Zeit zählt in den Summen mit, erscheint aber nicht als Block, weil dafür keine Uhrzeit bekannt ist.</p></details>
    <details><summary>Ziele</summary><ul>
      <li><b>Ziele</b> mit Name, Farbe, Input-Ziel in Stunden pro Woche und der Frage, wie das Ziel auf dein Jahresziel einzahlt.</li>
      <li><b>Uhr-Symbol:</b> Zeit nachtragen, wenn du vergessen hast, den Timer zu starten.</li>
      <li><b>Archivieren</b> beendet ein Ziel, die Stunden bleiben erhalten. <b>Löschen</b> entfernt alles endgültig.</li>
      <li><b>Kompass:</b> Vision, 5-Jahres-Ziel, Jahresziel und Monatsfokus. Hier prüfst du, ob deine Ziele dazu passen.</li></ul></details>
    <details><summary>Rückblick</summary><p>Dein wöchentliches Ritual. Er zeigt die Ziel-Stunden der Woche im Vergleich zur Vorwoche und zu deinen Input-Zielen, die Verteilung über die Tage, erledigte Aufgaben und die Zeit für Sonstiges. Dazu kommen vier Fragen, deren Antworten pro Woche gespeichert werden. Mit den Pfeilen blätterst du zurück zu früheren Wochen.</p></details>`);

  h+=sec('w-routine','Tages- und Wochenroutine',`
    <p><b>Jeden Morgen (2 Minuten)</b></p><ul><li>Heute öffnen. Was ist wirklich wichtig? Bring es in die richtige Reihenfolge.</li><li>Was nicht heute sein muss, schiebst du unter Woche auf einen anderen Tag.</li><li>Dann auf „Fokus starten“ tippen.</li></ul>
    <p><b>Tagsüber</b></p><ul><li>Im Fokus bleiben: eine Aufgabe, Timer, fertig, die nächste.</li><li>Kommt etwas dazwischen, drückst du auf Pause. Den Plan musst du nicht umbauen, die Reihenfolge bleibt.</li></ul>
    <p><b>Abends</b></p><ul><li>Kleinkram ohne Ziel erledigen, falls noch Energie da ist.</li><li>Ein Blick auf „Erledigt heute“.</li></ul>
    <p><b>Einmal pro Woche, z. B. Sonntag (20 Minuten)</b></p><ul><li>Rückblick öffnen: Zahlen anschauen und die vier Fragen beantworten.</li><li>Ziele und Kompass prüfen: Passt der Alltag noch?</li><li>Die neue Woche unter Woche grob verteilen.</li><li>Tipp: Geh den Rückblick mit jemandem durch, mit einem Freund oder einem Coach. Das macht ihn verbindlicher.</li></ul>`);

  h+=sec('w-begriffe','Begriffe',`<dl>
    <dt>Ziel</dt><dd>Ein langfristiges Vorhaben, das dir wichtig ist, z. B. Halbmarathon laufen, App launchen oder Bachelorarbeit abgeben. Am besten höchstens drei gleichzeitig.</dd>
    <dt>Aufgabe</dt><dd>Ein konkreter Schritt für einen Tag. Sie gehört zu einem Ziel oder steht unter „Ohne Ziel“.</dd>
    <dt>Ziel-Stunden</dt><dd>Zeit, die in Aufgaben zu deinen Zielen geflossen ist. Das ist die wichtigste Zahl in Motus.</dd>
    <dt>Input-Ziel</dt><dd>Wie viele Stunden pro Woche du in ein Ziel investieren willst.</dd>
    <dt>Sonstiges</dt><dd>Zeit für Aufgaben ohne Ziel. Sie wird erfasst, zählt aber nicht zu den Ziel-Stunden.</dd>
    <dt>Übernommen</dt><dd>Eine Aufgabe von einem früheren Tag, die noch offen ist und deshalb heute wieder erscheint.</dd>
    <dt>Logbuch</dt><dd>Das Protokoll deiner tatsächlich gearbeiteten Zeit.</dd>
    <dt>Kompass</dt><dd>Deine Vision und die Ziele für 5 Jahre, dieses Jahr und diesen Monat, also das „Oben“ der vertikalen Kohärenz.</dd></dl>`);

  h+=sec('w-faq','Häufige Fragen',`
    <details><summary>Läuft der Timer weiter, wenn ich die App schließe?</summary><p>Ja. Gespeichert wird die Startzeit, nicht ein laufender Zähler. Wenn du die App wieder öffnest, stimmt die Zeit.</p></details>
    <details><summary>Ich habe vergessen, den Timer zu starten.</summary><p>Unter Ziele beim jeweiligen Ziel auf das Uhr-Symbol tippen und die Minuten für den passenden Tag nachtragen.</p></details>
    <details><summary>Warum kann nur ein Timer gleichzeitig laufen?</summary><p>Absichtlich. Du arbeitest immer nur an einer Sache. Startest du eine andere Aufgabe, wird die vorherige automatisch pausiert und ihre Zeit gespeichert.</p></details>
    <details><summary>Warum gibt es keine Uhrzeiten zum Planen?</summary><p>Weil feste Zeitblöcke bei der ersten Unterbrechung zusammenbrechen und ständig neu sortiert werden müssen. Die Reihenfolge reicht. Wann du tatsächlich woran gearbeitet hast, zeigt dir das Logbuch hinterher.</p></details>
    <details><summary>Was passiert mit Aufgaben, die ich nicht schaffe?</summary><p>Sie wandern automatisch auf heute und sind als „übernommen“ markiert. Häufen sie sich, ist das ein gutes Thema für den Rückblick.</p></details>
    <details><summary>Ich habe mein Input-Ziel verfehlt, was nun?</summary><p>Nicht schlimm. Schau im Rückblick, warum. War das Ziel zu hoch, oder passt dein Alltag nicht dazu? Dann änderst du das eine oder das andere.</p></details>
    <details><summary>Wo werden meine Daten gespeichert?</summary><p>${STORAGE_HELP}</p></details>
    <details><summary>Wie lange bleiben erledigte Aufgaben sichtbar?</summary><p>Erledigte Aufgaben und Sitzungen bleiben einige Monate erhalten (Aufgaben 90 Tage, Sitzungen 180 Tage). Die erfassten Stunden pro Ziel bleiben dauerhaft.</p></details>`);
  return h;
}

// ================= Dialoge =================
function modal(html){$('#modal-root').innerHTML=`<div class="modal-bg" data-a="close-bg"><div class="modal">${html}</div></div>`;const i=$('#modal-root input');if(i)setTimeout(()=>i.focus(),50);}
function closeModal(){$('#modal-root').innerHTML='';}
let editColor=COLORS[0];
function goalModal(g){
  editColor=g?g.color:COLORS[S.goals.length%COLORS.length];
  modal(`<h3>${g?'Ziel bearbeiten':'Neues Ziel'}</h3>
  <form id="goal-form" data-g="${g?g.id:''}">
  <label>Name</label><input name="name" required maxlength="60" placeholder="z. B. Halbmarathon laufen" value="${g?esc(g.name):''}">
  <label>Wie zahlt es auf dein Jahresziel ein? (optional)</label><input name="why" maxlength="140" value="${g?esc(g.why||''):''}">
  <label>Input-Ziel: Stunden pro Woche</label><input name="target" type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="z. B. 5" value="${g&&g.target?g.target:''}">
  <label>Farbe</label><div class="colors">${COLORS.map(c=>`<button type="button" data-a="color" data-c="${c}" class="${c===editColor?'on':''}" style="background:${c}"></button>`).join('')}</div>
  <div class="actions">${g?`<button type="button" class="btn ghost" data-a="archive" data-g="${g.id}">${g.archived?'Reaktivieren':'Archivieren'}</button><button type="button" class="btn danger" data-a="ask-del-goal" data-g="${g.id}">Löschen</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-a="close">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>`);
}
function manualModal(gid){
  const g=goal(gid);
  modal(`<h3>Zeit nachtragen</h3><div class="small">${esc(g.name)}</div><form id="manual-form" data-g="${gid}">
  <label>Minuten</label><input name="min" type="number" min="1" max="1440" inputmode="numeric" required placeholder="z. B. 45">
  <label>Tag</label><input name="day" type="date" value="${todayKey()}" max="${todayKey()}">
  <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-a="close">Abbrechen</button><button class="btn" type="submit">Hinzufügen</button></div></form>`);
}

// ================= Ereignisse =================
function setTab(t){tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);if(t==='woche'){const c=$('#col-today');if(c&&window.innerWidth<820)c.scrollIntoView({inline:'start',block:'nearest'});}}
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){setTab(nb.dataset.tab);return;}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,gid=el.dataset.g,tid=el.dataset.t;
  if(a==='close-bg'&&e.target!==el)return;
  const tk=todayKey();
  switch(a){
    case 'tab':setTab(el.dataset.tab);break;
    case 'play':startTimer(tid);break;
    case 'stop':stopTimer();break;
    case 'focus-go':{const n=focusQueue()[0];if(n){S.running={goalId:n.goalId,taskId:n.id,start:Date.now()};save();}setTab('fokus');break;}
    case 'done':completeTask(tid,false);break;
    case 'focus-done':completeTask(tid,true);break;
    case 'reopen':reopenTask(tid);break;
    case 'later':{const t=S.tasks.find(x=>x.id===tid);if(!t)break;if(S.running&&S.running.taskId===tid)stopTimer(true);t.date=t.date<tk?tk:t.date;t.order=nextOrder(tk);save();render();break;}
    case 'up':case 'down':{const all=dayTasks(tk);const list=el.dataset.list==='o'?all.filter(t=>!isGoalTask(t)):all.filter(isGoalTask);moveInList(tid,a==='up'?-1:1,list);break;}
    case 'del-task':if(S.running&&S.running.taskId===tid)stopTimer(true);S.tasks=S.tasks.filter(x=>x.id!==tid);save();render();break;
    case 'move':{const t=S.tasks.find(x=>x.id===tid);if(!t)break;const nk=shiftKey(t.date<tk?tk:t.date,+el.dataset.d);t.date=nk;t.order=nextOrder(nk);save();render();break;}
    case 'toggle-other':showOther=!showOther;render();break;
    case 'week':weekOff=+el.dataset.d===0?0:weekOff+(+el.dataset.d);render();break;
    case 'log':logOff=+el.dataset.d===0?0:Math.min(0,logOff+(+el.dataset.d));render();break;
    case 'rev':revOff=+el.dataset.d===0?0:Math.min(0,revOff+(+el.dataset.d));render();break;
    case 'new-goal':goalModal(null);break;
    case 'edit-goal':goalModal(goal(gid));break;
    case 'manual':manualModal(gid);break;
    case 'color':editColor=el.dataset.c;document.querySelectorAll('.colors button').forEach(b=>b.classList.toggle('on',b.dataset.c===editColor));break;
    case 'archive':{const g=goal(gid);g.archived=!g.archived;if(g.archived&&S.running&&S.running.goalId===gid)stopTimer(true);save();closeModal();render();break;}
    case 'ask-del-goal':{const g=goal(gid);modal(`<h3>Ziel löschen?</h3><div class="small">„${esc(g.name)}“ mit allen Aufgaben und erfassten Zeiten wird endgültig gelöscht. Wenn du die Zeiten behalten willst, archiviere das Ziel lieber.</div><div class="actions"><span class="sp"></span><button class="btn ghost" data-a="close">Abbrechen</button><button class="btn danger" data-a="del-goal" data-g="${gid}">Löschen</button></div>`);break;}
    case 'del-goal':if(S.running&&S.running.goalId===gid)S.running=null;S.goals=S.goals.filter(g=>g.id!==gid);S.tasks=S.tasks.filter(t=>t.goalId!==gid);S.sessions=S.sessions.filter(x=>x.g!==gid);delete S.log[gid];save();closeModal();render();break;
    case 'close':case 'close-bg':closeModal();break;
    case 'jump':{const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'top':window.scrollTo({top:0,behavior:'smooth'});break;
    default:if(window.EXTRA_ACTIONS&&EXTRA_ACTIONS[a])EXTRA_ACTIONS[a](el);
  }
});
document.addEventListener('change',e=>{const t=e.target;if(t.classList.contains('add-goal'))lastGoal=t.value;if(window.EXTRA_CHANGE)EXTRA_CHANGE(t);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.review){const w=t.dataset.w;S.reviews[w]=S.reviews[w]||{};S.reviews[w][t.dataset.review]=t.value.slice(0,4000);save();}
  else if(t.dataset.compass){S.compass=S.compass||{};S.compass[t.dataset.compass]=t.value.slice(0,2000);save();}
  else if(t.dataset.note){const x=S.tasks.find(y=>y.id===t.dataset.note);if(x){x.notes=t.value.slice(0,4000);save();}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.dataset.add){const v=f.querySelector('input').value.trim();if(!v)return;const g=f.querySelector('select').value||'_none';lastGoal=g;const k=f.dataset.add;const sl=$('#board')?$('#board').scrollLeft:0;
    S.tasks.push({id:uid(),goalId:g,title:v,date:k,done:false,secs:0,order:nextOrder(k)});if(g==='_none'&&k===todayKey())showOther=true;save();render();
    if($('#board'))$('#board').scrollLeft=sl;const n=document.querySelector(`[data-add="${k}"] input`);if(n)n.focus();return;}
  if(f.id==='goal-form'){const fd=new FormData(f);const name=fd.get('name').trim();if(!name)return;const target=parseFloat(fd.get('target'))||0;const why=fd.get('why').trim();
    if(f.dataset.g){Object.assign(goal(f.dataset.g),{name,target,why,color:editColor});}
    else{const id=uid();S.goals.push({id,name,target,why,color:editColor,created:todayKey()});lastGoal=id;}
    save();closeModal();render();return;}
  if(f.id==='manual-form'){const fd=new FormData(f);const m=parseInt(fd.get('min'),10);if(!m||m<1)return;const day=fd.get('day')||todayKey();const g=f.dataset.g;S.log[g]=S.log[g]||{};S.log[g][day]=(S.log[g][day]||0)+m*60;save();closeModal();render();}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==tab&&TABS.includes(h)){tab=h;render();}});

// Drag & Drop (Maus)
let dragId=null;
document.addEventListener('dragstart',e=>{const it=e.target.closest&&e.target.closest('[data-drag]');if(!it)return;dragId=it.dataset.drag;it.classList.add('drag');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(_){}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));document.querySelectorAll('.dropline').forEach(x=>x.remove());});
function dropTarget(e){const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return null;const items=[...c.querySelectorAll('[data-drag]')].filter(x=>x.dataset.drag!==dragId);let before=null;for(const it of items){const r=it.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=it;break;}}return {c,before};}
document.addEventListener('dragover',e=>{if(!dragId)return;const d=dropTarget(e);if(!d)return;e.preventDefault();document.querySelectorAll('.dropline').forEach(x=>x.remove());const l=document.createElement('div');l.className='dropline';if(d.before)d.before.before(l);else{const items=d.c.querySelectorAll('[data-drag]');const last=items[items.length-1];if(last)last.after(l);else d.c.appendChild(l);}});
document.addEventListener('drop',e=>{if(!dragId)return;const d=dropTarget(e);if(!d)return;e.preventDefault();const id=dragId;dragId=null;placeTask(id,d.c.dataset.drop,d.before?d.before.dataset.drag:null);});

// ================= Live-Uhr =================
let lastDay=todayKey();
function tick(){
  if(todayKey()!==lastDay){lastDay=todayKey();softRender();return;}
  if(!S.running)return;
  document.querySelectorAll('[data-clock]').forEach(c=>c.textContent=fmtClock(runningSecs()));
  document.querySelectorAll('[data-live-task]').forEach(tl=>{const t=S.tasks.find(x=>x.id===tl.dataset.liveTask);if(t)tl.textContent=(tl.classList.contains('tm')?fmtShort:fmtDur)(taskSecs(t));});
  document.querySelectorAll('[data-live-focus]').forEach(tl=>{const t=S.tasks.find(x=>x.id===tl.dataset.liveFocus);if(t)tl.textContent=fmtClock(taskSecs(t));});
}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)softRender();});
initStore();
syncInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
