<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08150e">
<title>Motus</title>
<style>
:root{
  --bg:#08150e; --surface:#0f2218; --surface2:#15301f; --line:#22412d;
  --moss:#1d5a3a; --moss-hi:#247049; --moss-lo:#0c3322; --moss-text:#f2c46e;
  --gold:#fdbd4a; --gold-hi:#fed775; --sky:#156c83; --sky-deep:#0a3346; --on-gold:#1a2a12;
  --text:#f1ece0; --muted:#9aa89c; --danger:#c8614f;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--sky-deep) 0,#0a2a2c 160px,var(--bg) 420px) no-repeat,var(--bg);}
html,body{color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--moss-hi)}
.wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 20px calc(16px + env(safe-area-inset-left))}
.wrap.wide{max-width:1240px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.date{color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted)}
h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.timer{background:radial-gradient(90% 120% at 82% 18%,rgba(253,189,74,.38),transparent 55%),linear-gradient(170deg,var(--sky) 0%,#13503f 55%,var(--moss-lo) 100%);border:0;padding:18px;display:flex;align-items:center;gap:14px}
.timer .t{font-variant-numeric:tabular-nums;font-size:32px;font-weight:700;letter-spacing:-.02em}
.timer .lbl{font-size:13px;color:#f3e3bf;opacity:.9}
.timer .grow{flex:1;min-width:0}
.timer.idle{background:var(--surface);border:1px dashed var(--line)}
.timer.idle .t{color:var(--muted)}
.btn{background:var(--moss);color:#f6f1e4;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--moss-hi)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger)}
.btn.stop{background:var(--gold);color:var(--on-gold)}
.btn.stop:hover{background:var(--gold-hi)}
.btn.sm{padding:7px 11px;font-size:13px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none}
.icon:hover{background:var(--line)}
.icon.play{background:var(--moss);color:#fff}
.icon.on{background:var(--gold);color:var(--on-gold)}
.icon.xs{width:26px;height:26px;border-radius:7px}
.goal-h{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.goal-h .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-h .today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tasks{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px}
.task:hover{background:var(--surface2)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.chk.done{background:var(--gold);border-color:var(--gold)}
.task .tt{flex:1;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .meta{font-size:12px;color:var(--muted)}
.task .icon{width:30px;height:30px;border-radius:8px}
.add-task{display:flex;gap:8px;margin-top:8px}
.add-task input{padding:8px 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px}
.weekchart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:12px}
.weekchart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.weekchart .stack{width:100%;max-width:34px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--surface2);min-height:3px}
.weekchart .d{font-size:11px;color:var(--muted)}
.weekchart .d.now{color:var(--moss-text);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.empty .btn{margin-top:14px}
.collapse{font-size:13px;color:var(--muted);padding:6px 4px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.navbtns{display:flex;gap:6px;align-items:center}
.navbtns .lbl{color:var(--muted);font-size:14px;margin-right:6px}

/* Woche */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:340px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.daycol.past{opacity:.6}
.daycol.now{border-color:var(--gold)}
.dayhead{display:flex;align-items:baseline;gap:6px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.dayhead b{font-size:15px}
.dayhead span{color:var(--muted);font-size:13px}
.dayhead .sum{margin-left:auto;font-size:12px}
.daycol.now .dayhead b,.daycol.now .dayhead span:first-of-type{color:var(--moss-text)}
.add-day{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:6px}
.add-day input,.add-day select{padding:7px 9px;font-size:13px;border-radius:8px;background:transparent;border-color:transparent}
.add-day select{color:var(--muted)}
.add-day input:focus{background:var(--surface2)}
.tcard{background:var(--surface2);border:1px solid var(--line);border-left:3px solid;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.tcard .title{font-size:14px;line-height:1.35}
.tcard.done .title{text-decoration:line-through;color:var(--muted)}
.tcard.done{opacity:.65}
.tcard .foot{display:flex;align-items:center;gap:4px;min-width:0}
.daycol{min-width:0}
.tcard .chk{width:20px;height:20px;border-radius:6px}
.chip{display:inline-flex;min-width:0;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip i{width:6px;height:6px;border-radius:50%;flex:none}
.tcard .sp{flex:1}
.tcard .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tcard.running{border-color:var(--gold)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left}
.cell:hover{border-color:var(--moss)}
.cell .n{font-size:13px;font-weight:600}
.cell .m{font-size:10.5px;color:var(--moss-text);font-variant-numeric:tabular-nums}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.cell.today .n{color:var(--moss-text)}
.cell.sel{border-color:var(--gold);background:var(--surface2)}
.cell.blank{background:transparent;border:0}
.cell.future{opacity:.55}
@media(min-width:700px){.cell{min-height:88px}.cell .m{font-size:12px}}
.sess{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border-bottom:0}
.sess .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:94px}

/* Fokus */
.focus{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.ring{position:relative;width:260px;height:260px;margin:8px auto 18px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ring .sub{font-size:13px;color:var(--muted);margin-top:4px;max-width:180px}
.durs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.durs button{padding:9px 16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.durs button.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.focus-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:left}
.focus-form label{font-size:13px;color:var(--muted);margin-bottom:-4px}

/* Rückblick */
.review label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.review label:first-child{margin-top:0}
.trend{font-size:12px;margin-top:4px}
.up{color:var(--moss-text)} .down{color:#d9a07a}
.donelist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.donelist div{display:flex;gap:8px;align-items:center;font-size:14px}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,21,14,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;gap:2px;max-width:720px;width:100%}
nav button{flex:1;padding:7px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);min-width:0}
nav button.on{color:var(--moss-text);background:var(--surface)}
@media(min-width:820px){
  body{padding-bottom:30px;padding-top:62px}
  nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:10px 16px}
  nav .in{max-width:1240px;justify-content:center}
  nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 14px}
  nav button svg{width:16px;height:16px}
}
@media(min-width:1100px){.board{grid-auto-columns:minmax(150px,1fr);overflow-x:visible}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:440px}
@media(min-width:600px){.modal{border-radius:18px}}
.modal h3{font-size:18px;margin-bottom:14px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.modal .actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.modal .actions .sp{flex:1}

/* ---- v2: Prinzipien ---- */
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid;border-radius:12px;padding:9px 10px}
.qitem.first{border-color:var(--gold);box-shadow:0 0 0 1px rgba(253,189,74,.25)}
.qitem .tt{flex:1;min-width:0}
.qitem .tt .t1{font-size:15px;line-height:1.35}
.qitem .tt .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qitem .ord{display:flex;flex-direction:column;gap:2px}
.qitem .ord button{width:24px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.qitem .ord button:hover{background:var(--surface2);color:var(--text)}
.qitem.drag,.tcard.drag{opacity:.4}
.dropline{height:3px;border-radius:2px;background:var(--gold);margin:-2px 0}
.addbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addbar input{flex:1 1 180px}
.addbar select{flex:0 1 170px;width:auto}
.donelog{display:flex;flex-direction:column;gap:2px}
.donelog .d{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:14px}
.donelog .d .tt{flex:1;min-width:0}
.donelog .d .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.done-head{display:flex;align-items:baseline;justify-content:space-between}
.done-head .big{font-size:22px;font-weight:700;color:var(--gold)}
.qh{display:flex;flex-direction:column;gap:10px}
.qh .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.qh .r .bar{grid-column:1/3;margin-top:2px;height:6px}
.qh .r .n{display:flex;align-items:center;gap:8px;min-width:0}
.qh .r .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qh .r .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.other-toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:10px 4px}

/* Fokus v2 */
.fx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px}
.fx .ftitle{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:10px 0 4px;max-width:520px}
.fx .fclock{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0}
.fx .fclock.paused{color:var(--muted)}
.fx .fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.fx .fbtns .btn{padding:13px 20px;font-size:15px}
.fx textarea{max-width:520px;margin-top:14px;min-height:90px;text-align:left}
.fx .left{font-size:13px;color:var(--muted);margin-top:10px}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold-hi)}

/* Logbuch */
.tl-wrap{overflow-x:auto;padding-bottom:8px}
.tl{display:grid;grid-template-columns:40px repeat(7,minmax(118px,1fr));min-width:880px}
@media(min-width:1100px){.tl{min-width:0}}
.tl .hd{padding:6px 6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.tl .hd b{font-size:14px}
.tl .hd .s{font-size:11px;color:var(--muted);margin-top:2px}
.tl .hd.now b{color:var(--gold)}
.tl .hours{position:relative}
.tl .hours div{position:absolute;right:6px;font-size:10.5px;color:var(--muted);transform:translateY(-50%)}
.tl .col{position:relative;border-left:1px solid var(--line)}
.tl .col.now{background:rgba(253,189,74,.04)}
.tl .blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden;color:#0b1a10;font-weight:600}
.tl .blk.live{box-shadow:0 0 0 2px var(--gold)}
.tl .blk span{display:block;font-weight:400;opacity:.85}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 4px}
.legend span{display:flex;align-items:center;gap:6px}

/* Kompass */
.compass label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.compass label:first-of-type{margin-top:4px}
.compass textarea{min-height:46px}
.hint{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px;margin-bottom:12px}

/* Wiki */
.hbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-weight:700;color:var(--gold);flex:none}
.hbtn:hover{background:var(--line)}
.hbtn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.wiki{line-height:1.6}
.wiki .lead{font-size:16px;color:var(--text);margin-bottom:14px}
.wiki p{margin:8px 0;color:#d9dccf}
.wiki h3{font-size:17px;margin:2px 0 6px;letter-spacing:-.01em}
.wiki ul,.wiki ol{margin:6px 0 6px 20px;color:#d9dccf}
.wiki li{margin:4px 0}
.wiki b{color:var(--text)}
.wiki .where{font-size:13px;color:var(--gold);margin-top:6px}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.toc button{font-size:13px;padding:7px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.toc button:hover{border-color:var(--gold)}
.pr{display:flex;gap:12px}
.pr .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.wiki details{border-bottom:1px solid var(--line);padding:10px 0}
.wiki details:last-child{border-bottom:0}
.wiki summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.wiki summary::-webkit-details-marker{display:none}
.wiki summary::after{content:'+';color:var(--gold);font-weight:700}
.wiki details[open] summary::after{content:'–'}
.wiki dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:8px 14px;margin:4px 0}
.wiki dt{font-weight:600;color:var(--text)}
.wiki dd{color:#d9dccf}
@media(max-width:480px){.wiki dl{grid-template-columns:1fr}.wiki dd{margin-bottom:6px}}
.totop{font-size:12px;color:var(--muted);margin-top:8px;display:inline-block}

/* ---- v3: Themes, Profil, Einstellungen, Ablage, Etappen ---- */
:root{--text2:#d9dccf;--navbg:rgba(8,21,14,.95);--bggrad:linear-gradient(180deg,var(--sky-deep) 0,#0a2a2c 160px,var(--bg) 420px);--ok:#3fbf6a;--shadow:0 6px 24px rgba(0,0,0,.35)}
html[data-theme="light"]{
  --bg:#f3f1ea; --surface:#ffffff; --surface2:#eef0e7; --line:#dde2d4;
  --moss:#1f6e35; --moss-hi:#278a43; --moss-lo:#134a22; --moss-text:#9a6a0c;
  --gold:#e3a42b; --gold-hi:#f0b843; --on-gold:#1a2a12;
  --text:#18261c; --muted:#5e6c62; --text2:#2f3d33; --danger:#b8473a;
  --navbg:rgba(243,241,234,.95);
  --bggrad:linear-gradient(180deg,#cfe6ee 0,#e6efe4 170px,var(--bg) 420px);
  --shadow:0 6px 24px rgba(30,50,35,.12);
}
body{background:var(--bggrad) no-repeat,var(--bg)!important}
nav{background:var(--navbg)!important}
html[data-theme="light"] .timer.idle{background:var(--surface)}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(30,50,35,.05)}
html[data-theme="light"] .tl .blk{color:#0b1a10}
html[data-theme="light"] .btn.ghost{color:var(--text)}
.wiki p,.wiki ul,.wiki ol,.wiki dd{color:var(--text2)!important}

/* Avatar */
.avatar{position:relative;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--moss);color:#f6f1e4;font-weight:700;font-size:15px;overflow:visible;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .sd{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.avatar .sd.ok{background:var(--ok)} .avatar .sd.err{background:var(--danger)} .avatar .sd.busy{background:var(--gold)}
.avatar.big{width:72px;height:72px;font-size:26px}
.avatar.big .sd{width:16px;height:16px}
button.avatar:hover{border-color:var(--gold)}
button.avatar.on{border-color:var(--gold)}

/* Einstellungen */
.set h3{font-size:15px;margin-bottom:10px}
.set .row2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set .row2:first-of-type{border-top:0}
.set .row2 .l{flex:1 1 180px;min-width:0}
.set .row2 .l b{display:block;font-size:14px;font-weight:600}
.set .row2 .l span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
html[data-theme="dark"] .seg button.on{background:var(--moss);color:#fff}
.set select{width:auto;min-width:140px;padding:8px 10px}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .f{flex:1 1 200px;display:flex;flex-direction:column;gap:8px}
.statusline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.statusline i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.statusline i.ok{background:var(--ok)} .statusline i.err{background:var(--danger)} .statusline i.busy{background:var(--gold)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media(min-width:820px){.toast{bottom:30px}}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(253,189,74,.18),rgba(253,189,74,.06));border:1px solid rgba(253,189,74,.45);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner .tx{flex:1;min-width:0;font-size:14px}
.banner .tx b{display:block}
.banner .tx span{color:var(--muted);font-size:13px}

/* Ablage */
.daycol.ablage{background:var(--surface2);border-style:dashed}
.daycol.ablage .dayhead b{color:var(--gold)}
.ablagelink{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:10px 4px}
.ablagelink:hover{color:var(--text)}

/* Neustart */
.rs-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;margin:12px 0}
.rs-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid;border-radius:10px;background:var(--surface2)}
.rs-item .tt{flex:1;min-width:0;font-size:14px}
.rs-item .seg button{padding:5px 8px;font-size:12px}

/* Weg zur Sonne */
.path{margin-top:10px}
.path svg{width:100%;height:auto;display:block}
.path .track{fill:none;stroke:var(--surface2);stroke-width:6;stroke-linecap:round}
.path .done{fill:none;stroke-width:6;stroke-linecap:round}
.path .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;gap:8px;flex-wrap:wrap}
.milestones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.milestones span{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.milestones span.got{background:rgba(253,189,74,.16);border-color:rgba(253,189,74,.5);color:var(--text)}

/* Feier */
.celebrate{text-align:center;padding:6px 0}
.celebrate .sun{width:96px;height:96px;margin:4px auto 12px;border-radius:50%;background:radial-gradient(circle,var(--gold-hi) 0,var(--gold) 55%,rgba(253,189,74,0) 72%);animation:rise 1.1s ease-out}
@keyframes rise{from{transform:translateY(30px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.celebrate h3{font-size:20px}
.celebrate .small{font-size:14px;line-height:1.5}

/* Erledigt-Animation */
@keyframes pop{0%{transform:scale(.96);background:rgba(253,189,74,.25)}60%{transform:scale(1.01)}100%{transform:none;background:transparent}}
.pop{animation:pop .7s ease-out}

/* Jahresübersicht */
.year{overflow-x:auto;padding-bottom:6px}
.year .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.year .grid i{width:11px;height:11px;border-radius:3px;background:var(--surface2);display:block}
.year .grid i.l1{background:rgba(253,189,74,.28)} .year .grid i.l2{background:rgba(253,189,74,.5)}
.year .grid i.l3{background:rgba(253,189,74,.75)} .year .grid i.l4{background:var(--gold)}
.year .grid i.out{background:transparent}
.year .grid i.today{outline:1.5px solid var(--text);outline-offset:1px}
.year .lg{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.year .lg i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--surface2)}

/* Assistent */
.wz-steps{display:flex;gap:6px;margin-bottom:14px}
.wz-steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.wz-steps i.on{background:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tiles button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px 10px;text-align:left;font-size:14px}
.tiles button b{display:block;font-size:15px;margin-bottom:2px}
.tiles button span{font-size:12px;color:var(--muted)}
.tiles button:hover{border-color:var(--gold)}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.checks .ic{width:20px;flex:none;text-align:center}
.copyrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.copyrow code{flex:1;min-width:0;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--gold)}
html[data-theme="light"] .copyrow code{color:#8a5c00}
.modal{max-height:92vh;overflow:auto}
.modal ol{margin:8px 0 8px 20px;line-height:1.55}
@media(min-width:1100px){.board{grid-auto-columns:minmax(132px,1fr)!important;overflow-x:auto!important}}
.tcard .foot{flex-wrap:wrap;gap:2px}
.tcard .icon.xs{width:22px;height:22px;border-radius:6px}
.tcard .icon.xs svg{width:12px;height:12px}
@media (hover:hover) and (pointer:fine) and (min-width:1100px){.tcard [data-a=move]{display:none}}

button.brand{cursor:pointer;color:inherit;font:inherit;font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0}
button.brand:hover .logo{transform:scale(1.05)}
.logo{transition:transform .15s}

.gpick{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--text);max-width:100%;min-width:0}
.gpick i{width:10px;height:10px;border-radius:50%;flex:none}
.gpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpick svg{flex:none;color:var(--muted)}
.addbar .gpick{flex:0 1 auto}
.add-day .gpick{background:transparent;border-color:transparent;padding:6px 9px;font-size:13px;color:var(--muted);width:100%}
.add-day .gpick:hover{background:var(--surface2)}
.gp-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gp-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:16px;text-align:left;color:var(--text)}
.gp-row i{width:14px;height:14px;border-radius:50%;flex:none}
.gp-row span{flex:1}
.gp-row b{color:var(--gold)}
.gp-row.on{border-color:var(--gold)}

.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.quick .small{margin-right:2px}
.wrapseg{display:flex;flex-wrap:wrap}
.wrapseg button{display:inline-flex;align-items:center}
.goalhelp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.goalhelp summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--gold)}
.toast button{background:none;border:0;cursor:pointer;font-size:inherit}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#14200f;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:6;transition:transform .15s}
#fab:hover{transform:scale(1.06)}#fab:active{transform:scale(.94)}#fab[hidden]{display:none}
@media(min-width:820px){#fab{bottom:28px;right:28px}}
.qitem .tt,.tcard .title{cursor:pointer}
.seg .segdate{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;width:auto;min-width:0;max-width:150px}
.seg .segdate.on{background:var(--moss);color:#fff}
#qc-form textarea[name=t]{min-height:84px;font-size:15px}
#view{padding-bottom:70px}
.qchelp{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.qchelp summary{cursor:pointer;font-weight:600;font-size:14px}.qchelp .small{margin-top:8px;line-height:1.55}.qchelp ol{padding-left:18px;margin:0 0 8px}.qchelp li{margin:4px 0}
</style>
</head>

<script>
// ================= Grundlagen =================
const IS_PWA=true;
const VERSION='1.1';
const COLORS=['#fdbd4a','#2f8f5b','#2b8aa6','#8aa65a','#c77d4a','#b85c5c','#8a6bb5','#4aa38f'];
const MILESTONES=[5,10,25,50,100,250,500,1000,2500,5000];
const TABS=['heute','woche','fokus','ziele','rueckblick','einstellungen','hilfe'];
const CLIENT=Math.random().toString(36).slice(2,9);
const EMPTY=()=>({goals:[],tasks:[],log:{},running:null,sessions:[],reviews:{},compass:{},prefs:{},profile:{},meta:{},manual:[]});
const DEF_PREFS={lang:null,theme:'system',weekStart:1,dayStart:0,review:true,reviewDay:0,dismissed:{}};
let S=EMPTY();
let tab='heute';
try{const h=location.hash.slice(1);if(h==='kalender'||h==='logbuch')tab='rueckblick';else if(TABS.includes(h))tab=h;}catch(e){}
let weekOff=0,logOff=0,revOff=0,lastGoal=null,showOther=false,pendingRender=false,lastDoneId=null,SYNC_TEXT='',CLOUD='local';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const P=()=>Object.assign({},DEF_PREFS,S.prefs||{});
const lang=()=>P().lang||((navigator.language||'de').toLowerCase().startsWith('de')?'de':'en');
const tr=(de,en)=>lang()==='en'?en:de;
const LOC=()=>lang()==='en'?'en-GB':'de-DE';
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const shiftKey=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);};
const DS=()=>(+P().dayStart||0)*3600000;
const dayOf=ms=>dkey(new Date(ms-DS()));
const todayKey=()=>dayOf(Date.now());
const dayStartMs=k=>parseKey(k).getTime()+DS();
function weekOf(off){const b=parseKey(todayKey());const o=(b.getDay()-P().weekStart+7)%7;const out=[];for(let i=0;i<7;i++)out.push(new Date(b.getFullYear(),b.getMonth(),b.getDate()-o+i+off*7));return out;}
function fmtClock(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600);return (h?h+':'+pad(Math.floor(s%3600/60)):Math.floor(s%3600/60))+':'+pad(s%60);}
function fmtDur(s){s=Math.round(s/60);if(s<60)return s+' min';const h=Math.floor(s/60),m=s%60;return m?h+' h '+m+' min':h+' h';}
function fmtShort(s){const m=Math.round(s/60);if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?h+'h '+r:h+'h';}
const fmtTime=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());};
const NONE=()=>({id:'_none',name:tr('Ohne Ziel','No goal'),color:'#7f8c84'});
const goal=id=>id==='_none'?NONE():S.goals.find(g=>g.id===id);
const activeGoals=()=>S.goals.filter(g=>!g.archived);
const isGoalTask=t=>t.goalId!=='_none'&&!!S.goals.find(g=>g.id===t.goalId);
const rangeLabel=days=>{const a=days[0],b=days[6];return a.getDate()+'.'+(a.getMonth()+1)+'. – '+b.getDate()+'.'+(b.getMonth()+1)+'.'+b.getFullYear();};
const wdShort=d=>d.toLocaleDateString(LOC(),{weekday:'short'}).replace('.','');
const wdName=i=>new Date(2024,0,7+i).toLocaleDateString(LOC(),{weekday:'long'});
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const IN_CLAUDE=()=>false;

// ================= Zeit =================
let MAN={},MANTOT={};
function rebuildMan(){MAN={};MANTOT={};for(const e of (S.manual||[])){const k=e.g+'|'+e.day;MAN[k]=(MAN[k]||0)+e.secs;MANTOT[e.g]=(MANTOT[e.g]||0)+e.secs;}}
function runningSecs(){return S.running?(Date.now()-S.running.start)/1000:0;}
function secsOn(goalId,day){let v=((S.log[goalId]||{})[day]||0)+(MAN[goalId+'|'+day]||0);if(S.running&&S.running.goalId===goalId){const s0=dayStartMs(day),s1=dayStartMs(shiftKey(day,1));const a=Math.max(S.running.start,s0),b=Math.min(Date.now(),s1);if(b>a)v+=(b-a)/1000;}return v;}
const goalSecs=day=>S.goals.reduce((a,g)=>a+secsOn(g.id,day),0);
const allSecs=day=>goalSecs(day)+secsOn('_none',day);
function totalSecs(goalId){let v=Object.values(S.log[goalId]||{}).reduce((a,b)=>a+b,0)+(MANTOT[goalId]||0);if(S.running&&S.running.goalId===goalId)v+=runningSecs();return v;}
const taskSecs=t=>(t.secs||0)+(S.running&&S.running.taskId===t.id?runningSecs():0);
function addTime(goalId,startMs,endMs){
  S.log[goalId]=S.log[goalId]||{};
  let t=startMs;
  while(t<endMs){const k=dayOf(t);const e=Math.min(dayStartMs(shiftKey(k,1)),endMs);S.log[goalId][k]=Math.round((S.log[goalId][k]||0)+(e-t)/1000);t=e;}
}
function startTimer(taskId){
  const t=S.tasks.find(x=>x.id===taskId);if(!t)return;
  if(S.running)stopTimer(true);
  if(!t.date)t.date=todayKey();
  S.running={goalId:t.goalId,taskId:t.id,start:Date.now()};
  save();render();
}
function stopTimer(silent){
  const r=S.running;if(!r)return;
  const end=Date.now();
  if(end-r.start>=1000){
    addTime(r.goalId,r.start,end);
    if(r.taskId){const t=S.tasks.find(x=>x.id===r.taskId);if(t)t.secs=Math.round((t.secs||0)+(end-r.start)/1000);}
    S.sessions.push({g:r.goalId,t:r.taskId,s:r.start,e:end});
  }
  S.running=null;
  checkMilestones();
  if(!silent){save();render();}
}
function completeTask(id,autoNext){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const wasRunning=S.running&&S.running.taskId===id;
  if(wasRunning)stopTimer(true);
  t.done=true;t.doneOn=todayKey();t.doneAt=Date.now();if(!t.date)t.date=todayKey();
  lastDoneId=id;
  if(autoNext&&wasRunning){const n=focusQueue()[0];if(n){S.running={goalId:n.goalId,taskId:n.id,start:Date.now()};}}
  save();render();
}
function reopenTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=false;t.doneOn=null;t.doneAt=null;if(t.date&&t.date<todayKey())t.date=todayKey();t.order=nextOrder(t.date);save();render();}

// ================= Etappen =================
function nextMilestone(h){return MILESTONES.find(m=>m>h)||null;}
function checkMilestones(){
  rebuildMan();
  for(const g of S.goals){
    const h=totalSecs(g.id)/3600;
    const reached=MILESTONES.filter(m=>m<=h).pop()||0;
    if(g.ms==null){g.ms=reached;continue;}
    if(reached>g.ms){g.ms=reached;celebrate(g,reached);return;}
  }
}
let celebrateQueue=null;
function celebrate(g,h){
  const nx=nextMilestone(h);
  const html=`<div class="celebrate"><div class="sun"></div><h3>${tr('Etappe erreicht','Milestone reached')}</h3><div class="small" style="margin-top:6px">${tr(`<b>${h} Stunden</b> hast du schon in „${esc(g.name)}“ gesteckt. Das ist ein echtes Stück Weg.`,`You have invested <b>${h} hours</b> in “${esc(g.name)}”. That is real progress.`)}${nx?`<br>${tr('Nächste Etappe','Next milestone')}: ${nx} h`:''}</div><div class="actions" style="justify-content:center"><button class="btn gold" data-a="close">${tr('Weiter geht’s','Keep going')}</button></div></div>`;
  if($('#modal-root').innerHTML)celebrateQueue=html;else modal(html);
}

// ================= Reihenfolge & Ablage =================
function dayTasks(k){const tk=todayKey();return S.tasks.filter(t=>!t.done&&t.date&&goal(t.goalId)&&(k===tk?t.date<=tk:t.date===k)).sort(byOrder);}
const backlog=()=>S.tasks.filter(t=>!t.done&&!t.date&&goal(t.goalId)).sort(byOrder);
function focusQueue(){const q=dayTasks(todayKey());return [...q.filter(isGoalTask),...q.filter(t=>!isGoalTask(t))];}
function nextOrder(k){const l=k?S.tasks.filter(t=>t.date===k||(k===todayKey()&&t.date&&t.date<k&&!t.done)):backlog();return l.length?Math.max(...l.map(t=>t.order||0))+1:Date.now();}
function moveInList(id,dir,list){const i=list.findIndex(t=>t.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;const a=list[i],b=list[j];let oa=a.order||0,ob=b.order||0;if(oa===ob)ob=oa+dir;a.order=ob;b.order=oa;save();render();}
function placeTask(id,dropKey,beforeId){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const k=dropKey==='ablage'?null:dropKey;
  t.date=k;
  const list=(k===null?backlog():k===todayKey()?dayTasks(k):S.tasks.filter(x=>x.date===k&&!x.done).sort(byOrder)).filter(x=>x.id!==id);
  if(!beforeId){t.order=list.length?(list[list.length-1].order||0)+1:Date.now();}
  else{const i=list.findIndex(x=>x.id===beforeId);const nxt=list[i],prv=list[i-1];t.order=prv?((prv.order||0)+(nxt.order||0))/2:(nxt.order||0)-1;}
  if(k===null&&S.running&&S.running.taskId===id)stopTimer(true);
  save();render();
}

// ================= Speichern =================
let ref=null,saveTimer=null,writing=Promise.resolve(),lastRev=null;
function normalize(o){const s=Object.assign(EMPTY(),o||{});if(!Array.isArray(s.manual))s.manual=[];['prefs','profile','meta','compass','reviews','log'].forEach(k=>{if(!s[k]||typeof s[k]!=='object')s[k]={};});s.tasks.forEach((t,i)=>{if(!t.goalId)t.goalId='_none';if(t.order==null)t.order=i;});return s;}
function localLoad(){try{const v=localStorage.getItem('motus');if(v)S=normalize(JSON.parse(v));}catch(e){}}
function localSave(){try{localStorage.setItem('motus',JSON.stringify(S));}catch(e){}}
function save(){
  localSave();markDirty();
  if(!ref)return;
  clearTimeout(saveTimer);

function reviewDue(){
  const p=P();if(!p.review)return null;
  const today=parseKey(todayKey());const back=(today.getDay()-p.reviewDay+7)%7;if(back>2)return null;
  const rd=new Date(today);rd.setDate(rd.getDate()-back);
  const r=new Date(rd);if(rd.getDay()===+p.weekStart)r.setDate(r.getDate()-1);
  const o=(r.getDay()-p.weekStart+7)%7;r.setDate(r.getDate()-o);const wk=dkey(r);
  const rv=S.reviews[wk];if(rv&&Object.values(rv).some(v=>v&&String(v).trim()))return null;
  if(p.dismissed&&p.dismissed[wk])return null;
  return wk;
}

function logSection(days){

  const perDay=keys.map(k=>{const s0=dayStartMs(k),s1=dayStartMs(shiftKey(k,1));return ses.filter(x=>x.e>s0&&x.s<s1).map(x=>({...x,a:Math.max(x.s,s0),b:Math.min(x.e,s1),s0}));});

    h+=`<div class="hd ${k===tk?'now':''}"><b>${wdShort(d)} ${d.getDate()}.</b><div class="s">${al>=60?fmtShort(qs)+tr(' Ziele',' goals'):'–'}${al-qs>=60?' · '+fmtShort(al-qs)+tr(' sonst.',' other'):''}${dn?' · '+dn+' ✓':''}</div></div>`;});
  h+=`<div class="hours" style="height:${H}px">${Array.from({length:h1-h0+1},(_,i)=>`<div style="top:${i*PX}px">${pad((h0+i+ds)%24)}</div>`).join('')}</div>`;
  perDay.forEach((list,i)=>{
    h+=`<div class="col ${keys[i]===tk?'now':''}" style="height:${H}px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ${PX-1}px,var(--line) ${PX-1}px,var(--line) ${PX}px)">`;
    list.forEach(x=>{const g=goal(x.g)||NONE(),t=S.tasks.find(y=>y.id===x.t);const top=((x.a-x.s0)/3600000-h0)*PX,ht=Math.max(3,(x.b-x.a)/3600000*PX);
      h+=`<div class="blk ${x.live?'live':''}" style="top:${top}px;height:${ht}px;background:${g.color}" title="${fmtTime(x.s)}–${x.live?tr('jetzt','now'):fmtTime(x.e)} · ${esc(t?t.title:g.name)}">${ht>=22?esc(t?t.title:g.name):''}${ht>=40?`<span>${fmtTime(x.s)}–${x.live?tr('jetzt','now'):fmtTime(x.e)}</span>`:''}</div>`;});
    h+='</div>';

  h+=`<h2>${tr('Nachgetragen','Added manually')}${man.length?' · '+fmtShort(man.reduce((a,e)=>a+e.secs,0)):''}</h2><div class="card">${man.length?`<div class="donelog">${man.map(e=>{const g=goal(e.g);return `<div class="d"><span class="dot" style="background:${g.color}"></span><div class="tt">${esc(g.name)}${e.note?` <span class="small">· ${esc(e.note)}</span>`:''}<div class="small">${parseKey(e.day).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'})}</div></div><span class="tm">${fmtShort(e.secs)}</span><button class="icon xs" data-a="mn-edit" data-id="${e.id}" title="${tr('Bearbeiten','Edit')}">✎</button></div>`;}).join('')}</div>`:`<div class="small">${tr('Zeit ohne Timer, z. B. fürs Training. Hier kannst du sie später auch korrigieren.','Time without a timer, e.g. for training. You can correct it here later too.')}</div>`}<div style="margin-top:10px"><button class="btn ghost sm" data-a="mn-new">+ ${tr('Zeit nachtragen','Add time')}</button></div></div>`;

function yearGrid(){
  const y=new Date(Date.now()-DS()).getFullYear(),tk=todayKey(),ws=+P().weekStart;
  const first=new Date(y,0,1);const lead=(first.getDay()-ws+7)%7;
  const start=new Date(y,0,1-lead);const end=new Date(y,11,31);
  let cells='',d=new Date(start),tot=0,act=0;
  while(d<=end||((d.getDay()-ws+7)%7)!==0){
    const k=dkey(d),inY=d.getFullYear()===y;let cls='out',tt='';
    if(inY){const s=goalSecs(k);if(k<=tk){tot+=s;if(s>=60)act++;}cls=s<60?'':s<1800?'l1':s<3600?'l2':s<7200?'l3':'l4';tt=d.toLocaleDateString(LOC(),{day:'numeric',month:'short'})+' · '+fmtShort(s);if(k===tk)cls+=' today';}
    cells+=`<i class="${cls}" ${tt?`title="${tt}"`:''}></i>`;d.setDate(d.getDate()+1);if(cells.length>40000)break;
  }
  return `<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:10px"><b style="font-size:14px">${tr('Dein Jahr','Your year')} ${y}</b><span class="small">${fmtShort(tot)} ${tr('Ziel-Stunden an','goal hours on')} ${act} ${act===1?tr('Tag','day'):tr('Tagen','days')}</span></div><div class="year"><div class="grid">${cells}</div></div><div class="year"><div class="lg">${tr('weniger','less')} <i></i><i style="background:rgba(253,189,74,.28)"></i><i style="background:rgba(253,189,74,.5)"></i><i style="background:rgba(253,189,74,.75)"></i><i style="background:var(--gold)"></i> ${tr('mehr','more')}</div></div></div>`;
}

function exportJSON(){return JSON.stringify({app:'motus',v:3,exported:new Date().toISOString(),state:S},null,1);}
async function doExport(){
  const txt=exportJSON();
  if(IN_CLAUDE()){try{await navigator.clipboard.writeText(txt);toast(tr('Daten in die Zwischenablage kopiert','Data copied to clipboard'));}catch(e){modal(`<h3>${tr('Sicherung','Backup')}</h3><div class="small">${tr('Markiere den Text und kopiere ihn.','Select the text and copy it.')}</div><textarea style="min-height:200px;margin-top:10px;font-size:11px">${esc(txt)}</textarea><div class="actions"><button class="btn" data-a="close">OK</button></div>`);}return;}
  const b=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='motus-sicherung-'+todayKey()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=160,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

const STORAGE_HELP=()=>IS_PWA?tr(`Zuerst nur in diesem Browser. Unter <b>Einstellungen → Synchronisierung</b> (dein Profilbild oben rechts) kannst du deinen eigenen Cloud-Speicher verbinden: <b>Dropbox, Google Drive, OneDrive oder pCloud</b>. Motus legt dort nur eine Datei <b>motus.json</b> in einem eigenen App-Ordner an und sieht deine anderen Dateien nicht. Darüber gleichen sich deine Geräte ab: beim Öffnen, nach jeder Änderung und alle zwei Minuten. Bei gleichzeitigen Änderungen gewinnt die neuere Version. Einen Motus-Server gibt es nicht.`,`At first only in this browser. Under <b>Settings → Sync</b> (your profile picture top right) you can connect your own cloud storage: <b>Dropbox, Google Drive, OneDrive or pCloud</b>. Motus only creates a single file <b>motus.json</b> in its own app folder and cannot see your other files. Your devices sync through it: on opening, after every change and every two minutes. If two devices change things at the same time, the newer version wins. There is no Motus server.`):'';

  h+=sec('w-grund',L('Grundsätze von Motus','Motus principles'),`<ol>
    <li><b>${L('Motus macht kein schlechtes Gewissen.','Motus never makes you feel guilty.')}</b> ${L('Keine Strafen, keine Vorwürfe, keine Serien, die reißen können.','No penalties, no reproaches, no streaks that can break.')}</li>
    <li><b>${L('Pausen sind normal.','Breaks are normal.')}</b> ${L('Wenn du das Tool nicht nutzt, hat das einen Grund, und der liegt nicht bei dir. Nach einer Pause gibt es ein freundliches Willkommen und einen leichten Neustart.','If you don’t use the tool, there is a reason, and it isn’t you. After a break you get a friendly welcome and an easy fresh start.')}</li>
    <li><b>${L('Belohnt wird echter Fortschritt.','Real progress is what counts.')}</b> ${L('Gezählt werden investierte Stunden in deine Ziele, nicht Häkchen oder tägliches Öffnen.','What counts is hours invested in your goals, not checkmarks or daily opens.')}</li>
    <li><b>${L('Du bestimmst.','You decide.')}</b> ${L('Erinnerungen sind Einladungen und lassen sich abschalten.','Reminders are invitations and can be switched off.')}</li>
    <li><b>${L('Deine Daten gehören dir.','Your data belongs to you.')}</b> ${L('Kein fremder Server, kein Tracking.','No third-party server, no tracking.')}</li></ol>`);
  h+=sec('w-prinzipien',L('Die 6 Prinzipien','The 6 principles'),
    pr(1,L('Nach Tagen planen, nicht nach Stunden','Plan by day, not by hour'),L('Feste Zeitblöcke stressen und brechen bei jeder Unterbrechung zusammen. Verteile Aufgaben stattdessen auf Tage und bring sie in eine Reihenfolge nach Wichtigkeit.','Fixed time blocks are stressful and collapse with every interruption. Instead, spread tasks across days and order them by importance.'),L('Heute, Woche, Ablage','Today, Week, Backlog'))+
    pr(2,L('Immer nur eine Aufgabe sehen','See only one task at a time'),L('Wer ständig sieht, was noch alles ansteht, verliert Energie für das Jetzt. Im Fokus siehst du nur die aktuelle Aufgabe. Ist sie erledigt, kommt die nächste.','Constantly seeing everything ahead drains energy for the present. In Focus you only see the current task. When it’s done, the next one appears.'),L('Fokus','Focus'))+
    pr(3,L('Messen, wohin die Zeit fließt','Measure where your time goes'),L('Was man misst, wird besser. Jede Minute läuft auf eine Aufgabe und damit auf ein Ziel.','What gets measured gets better. Every minute goes to a task and therefore to a goal.'),L('Timer bei jeder Aufgabe, Nachtragen, Rückblick','Timer on every task, manual logging, Review'))+
    pr(4,L('Erledigt-Liste statt To-do-Liste','Done list instead of to-do list'),L('Schau nicht auf den Berg, der noch vor dir liegt, sondern auf den, den du schon erklommen hast.','Don’t look at the mountain still ahead, look at the one you have already climbed.'),L('Erledigt heute, Rückblick, Jahresübersicht','Done today, Review, year overview'))+

      <li>${L('<b>▶</b> startet den Timer, <b>❚❚</b> pausiert ihn. Kästchen antippen heißt erledigt, mit ↶ holst du eine Aufgabe zurück.','<b>▶</b> starts the timer, <b>❚❚</b> pauses it. Tapping the box marks it done, ↶ brings a task back.')}</li>

      <li>${L('<b>Aufgaben ohne Ziel</b> stehen eingeklappt unten, damit sie nicht ablenken.','<b>Tasks without a goal</b> are collapsed at the bottom so they don’t distract you.')}</li></ul></details>
    <details><summary>${L('Woche & Ablage','Week & backlog')}</summary><p>${L('Eine Spalte pro Tag, ganz links die <b>Ablage</b> für alles ohne festen Tag. Mit ‹ › verschiebst du um einen Tag, mit dem Kisten-Symbol in die Ablage, mit dem Kalender-Symbol aus der Ablage auf heute. Am Computer ziehst du Karten einfach dorthin, wo sie hin sollen.','One column per day, with the <b>backlog</b> on the far left for everything without a fixed day. ‹ › moves a task by one day, the box icon moves it to the backlog, the calendar icon moves it from the backlog to today. On a computer, just drag cards where you want them.')}</p></details>
    <details><summary>${L('Schnell erfassen & bearbeiten','Quick capture & editing')}</summary><p>${L('Der goldene <b>+</b>-Knopf (am Computer die Taste <b>N</b>) öffnet ein Feld für neue Aufgaben. Ohne weitere Angabe landen sie in der <b>Ablage</b>, sortiert wird später. Eine Zeile pro Aufgabe, so kannst du ganze Listen einfügen. Schreibst du „heute“, „morgen“ oder einen Wochentag wie „fr“ ans Zeilenende, wird die Aufgabe direkt eingeplant. „#Sport“ ordnet sie dem Ziel Sport zu. Aus anderen Apps kommst du über das Teilen-Menü, einen Kurzbefehl oder ein Lesezeichen herein, siehe Einstellungen → Schnell erfassen. <b>Bearbeiten:</b> Tippe auf den Titel einer Aufgabe. Dann kannst du Text, Tag, Ziel und Notizen ändern oder sie löschen.','The golden <b>+</b> button (on a computer the <b>N</b> key) opens a field for new tasks. Without further info they go to the <b>backlog</b>, to be sorted later. One line per task, so you can paste whole lists. Put “today”, “tomorrow” or a weekday like “fri” at the end of a line to plan it right away. “#Sport” assigns it to the goal Sport. From other apps use the share menu, a shortcut or a bookmark, see Settings → Quick capture. <b>Editing:</b> tap a task’s title to change its text, day, goal and notes, or to delete it.')}</p></details>

    <details><summary>${L('Ziele & Weg zur Sonne','Goals & path to the sun')}</summary><p>${L('Jedes Ziel hat einen <b>Weg zur Sonne</b>. Jede Stunde bringt dich ein Stück weiter zur nächsten <b>Etappe</b> (5, 10, 25, 50, 100 Stunden …). Erreichst du eine, feiert Motus kurz mit dir. Mit <b>+30 min</b>, <b>+60 min</b> oder <b>Andere…</b> trägst du Zeit ohne Timer nach, auch für vergangene Tage. Archivieren beendet ein Ziel, die Stunden bleiben erhalten.','Each goal has a <b>path to the sun</b>. Every hour moves you closer to the next <b>milestone</b> (5, 10, 25, 50, 100 hours …). When you reach one, Motus briefly celebrates with you. Use <b>+30 min</b>, <b>+60 min</b> or <b>Other…</b> to log time without the timer, also for past days. Archiving ends a goal, the hours are kept.')}</p></details>

    <details><summary>${L('Einstellungen','Settings')}</summary><p>${L('Über dein Profilbild oben rechts: Name und Bild, Hell/Dunkel, Sprache, Wochenstart, Tagesbeginn, Rückblick-Erinnerung, Synchronisierung sowie Sichern, Laden und Löschen deiner Daten.','Via your profile picture top right: name and picture, light/dark, language, week start, start of day, review reminder, sync, and backing up, restoring and deleting your data.')}</p></details>`);
  h+=sec('w-routine',L('Tages- und Wochenroutine','Daily and weekly routine'),`
    <p><b>${L('Jeden Morgen (2 Minuten)','Every morning (2 minutes)')}</b></p><ul><li>${L('Heute öffnen, das Wichtige nach oben, Unwichtiges auf später oder in die Ablage.','Open Today, important things to the top, the rest to later or the backlog.')}</li><li>${L('Fokus starten.','Start focus.')}</li></ul>
    <p><b>${L('Tagsüber','During the day')}</b></p><ul><li>${L('Eine Aufgabe, Timer, fertig, die nächste. Kommt etwas dazwischen: Pause. Der Plan muss nicht umgebaut werden.','One task, timer, done, next. If something comes up: pause. No need to rebuild the plan.')}</li></ul>
    <p><b>${L('Einmal pro Woche (20 Minuten)','Once a week (20 minutes)')}</b></p><ul><li>${L('Rückblick: Zahlen anschauen, Fragen beantworten, Ziele prüfen, neue Woche grob verteilen.','Review: look at the numbers, answer the questions, check your goals, roughly plan the new week.')}</li><li>${L('Tipp: Mit jemandem durchgehen macht es verbindlicher.','Tip: going through it with someone makes it more binding.')}</li></ul>`);
  h+=sec('w-begriffe',L('Begriffe','Glossary'),`<dl>
    <dt>${L('Ziel','Goal')}</dt><dd>${L('Ein langfristiges Vorhaben, das dir wichtig ist. Am besten höchstens drei gleichzeitig.','A long-term pursuit that matters to you. Ideally no more than three at a time.')}</dd>
    <dt>${L('Aufgabe','Task')}</dt><dd>${L('Ein konkreter Schritt. Gehört zu einem Ziel oder steht unter „Ohne Ziel“.','A concrete step. Belongs to a goal or sits under “No goal”.')}</dd>
    <dt>${L('Ablage','Backlog')}</dt><dd>${L('Aufgaben und Ideen ohne festen Tag. Nichts geht verloren.','Tasks and ideas without a fixed day. Nothing gets lost.')}</dd>
    <dt>${L('Ziel-Stunden','Goal hours')}</dt><dd>${L('Zeit, die in Aufgaben zu deinen Zielen geflossen ist. Die wichtigste Zahl.','Time spent on tasks for your goals. The most important number.')}</dd>
    <dt>${L('Input-Ziel','Input goal')}</dt><dd>${L('Wie viele Stunden pro Woche du in ein Ziel investieren willst.','How many hours per week you want to invest in a goal.')}</dd>
    <dt>${L('Etappe','Milestone')}</dt><dd>${L('Eine Marke bei den gesamten Stunden eines Ziels, z. B. 50 Stunden.','A mark in a goal’s total hours, e.g. 50 hours.')}</dd>
    <dt>${L('Sonstiges','Other')}</dt><dd>${L('Zeit für Aufgaben ohne Ziel. Wird erfasst, zählt aber nicht zu den Ziel-Stunden.','Time for tasks without a goal. Tracked, but not counted as goal hours.')}</dd>
    <dt>${L('Nachgetragen','Added manually')}</dt><dd>${L('Zeit, die du ohne Timer einträgst. Im Rückblick sichtbar und änderbar.','Time you log without the timer. Visible and editable in Review.')}</dd>
</dl>`);
  h+=sec('w-faq',L('Häufige Fragen','FAQ'),`
    <details><summary>${L('Läuft der Timer weiter, wenn ich die App schließe?','Does the timer keep running when I close the app?')}</summary><p>${L('Ja. Gespeichert wird die Startzeit. Beim Öffnen stimmt die Zeit.','Yes. The start time is saved, so the time is right when you open it again.')}</p></details>
    <details><summary>${L('Ich habe vergessen, den Timer zu starten.','I forgot to start the timer.')}</summary><p>${L('Unter Ziele beim Ziel auf „+30 min“, „+60 min“ oder „Andere…“ tippen. Dort wählst du auch Gestern, Vorgestern oder ein Datum. Falsche Einträge korrigierst du im Rückblick unter „Nachgetragen“.','Under Goals, tap “+30 min”, “+60 min” or “Other…” on the goal. There you can also pick yesterday, the day before or a date. Fix wrong entries in Review under “Added manually”.')}</p></details>
    <details><summary>${L('Warum nur ein Timer gleichzeitig?','Why only one timer at a time?')}</summary><p>${L('Absichtlich: Du arbeitest immer nur an einer Sache.','On purpose: you only ever work on one thing.')}</p></details>
    <details><summary>${L('Warum gibt es keine Serien oder Punkte?','Why are there no streaks or points?')}</summary><p>${L('Weil sie Beschäftigung statt Fortschritt belohnen und Druck machen. Motus feiert stattdessen echte investierte Stunden.','Because they reward busyness over progress and create pressure. Motus celebrates real invested hours instead.')}</p></details>
    <details><summary>${L('Was passiert, wenn ich länger nicht da war?','What happens if I was away for a while?')}</summary><p>${L('Nach 3 Tagen Pause fragt Motus einmal, was mit den offenen Aufgaben passieren soll: durchgehen, alle in die Ablage oder behalten.','After a 3-day break Motus asks once what to do with open tasks: go through them, move all to the backlog, or keep them.')}</p></details>
    <details><summary>${L('Ich arbeite oft nach Mitternacht.','I often work past midnight.')}</summary><p>${L('In den Einstellungen kannst du den Tagesbeginn auf z. B. 4 Uhr legen. Dann zählt die Nacht noch zum Vortag.','In Settings you can set the start of the day to e.g. 4 am. The night then still counts for the previous day.')}</p></details>
    <details><summary>${L('Wo werden meine Daten gespeichert?','Where is my data stored?')}</summary><p>${STORAGE_HELP()}</p></details>
    <details><summary>${L('Wie lange bleiben erledigte Aufgaben sichtbar?','How long do finished tasks stay visible?')}</summary><p>${L('Erledigte Aufgaben 90 Tage, Sitzungen 180 Tage. Die Stunden pro Ziel bleiben dauerhaft.','Finished tasks 90 days, sessions 180 days. Hours per goal are kept permanently.')}</p></details>`);
  return h;
}

// ================= Dialoge =================
function modal(html){$('#modal-root').innerHTML=`<div class="modal-bg" data-a="close-bg"><div class="modal">${html}</div></div>`;const i=$('#modal-root input:not([type=file])');if(i&&!('ontouchstart' in window))setTimeout(()=>i.focus(),50);}
function closeModal(){$('#modal-root').innerHTML='';if(celebrateQueue){const h=celebrateQueue;celebrateQueue=null;modal(h);}}
let editColor=COLORS[0];
function goalModal(g){
  editColor=g?g.color:COLORS[S.goals.length%COLORS.length];
  modal(`<h3>${g?tr('Ziel bearbeiten','Edit goal'):tr('Neues Ziel','New goal')}</h3>
  ${g?'':`<details class="goalhelp" ${S.goals.length?'':'open'}><summary>${tr('Was ist ein gutes Ziel?','What makes a good goal?')}</summary><div class="small" style="line-height:1.55;margin-top:8px">${tr('Ein Ziel ist eines der <b>2–3 Dinge, in die du in den nächsten Wochen oder Monaten bewusst Zeit stecken willst</b>. Große Lebensfragen wie „Wer will ich sein?“ gehören nicht hierher, sondern ins Notizbuch oder ins Gespräch.','A goal is one of the <b>2–3 things you want to consciously invest time in over the next weeks or months</b>. Big life questions like “Who do I want to be?” don’t belong here, but in a notebook or a conversation.')}<ul style="margin:8px 0 8px 18px"><li>${tr('ist dir wirklich wichtig','really matters to you')}</li><li>${tr('du willst pro Woche Stunden hineinstecken','you want to put hours into it each week')}</li><li>${tr('läuft ein paar Wochen bis Monate','runs for a few weeks to months')}</li></ul>${tr('<b>Gut:</b> „Halbmarathon im April laufen“, „Spanisch auf B1“, „Weiterbildung abschließen“<br><b>Eher nicht:</b> „Gesund sein“ (zu vage), „Arbeit“ (zu allgemein), Haushalt<br><br>Den Timer musst du nicht nutzen. Zeit, z. B. fürs Training, trägst du einfach mit einem Tipp nach.','<b>Good:</b> “Run a half marathon in April”, “Spanish to B1”, “Finish my training course”<br><b>Rather not:</b> “Be healthy” (too vague), “Work” (too broad), chores<br><br>You don’t have to use the timer. Time, e.g. for training, can be added with one tap.')}</div></details>`}
  <form id="goal-form" data-g="${g?g.id:''}">
  <label>${tr('Name','Name')}</label><input name="name" required maxlength="60" placeholder="${tr('z. B. Halbmarathon laufen','e.g. Run a half marathon')}" value="${g?esc(g.name):''}">
  <label>${tr('Warum ist dir das wichtig? (optional)','Why does this matter to you? (optional)')}</label><input name="why" maxlength="140" placeholder="${tr('z. B. Mehr Energie für den Alltag','e.g. More energy for everyday life')}" value="${g?esc(g.why||''):''}"><div class="small" style="margin-top:6px">${tr('Ein kurzer Satz in deinen Worten. Er steht später unter dem Ziel und erinnert dich daran, wofür du die Zeit investierst.','A short sentence in your own words. It appears under the goal and reminds you what you invest the time for.')}</div>
  <label>${tr('Input-Ziel: Stunden pro Woche','Input goal: hours per week')}</label><input name="target" type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="${tr('z. B. 5','e.g. 5')}" value="${g&&g.target?g.target:''}"><div class="small" style="margin-top:6px">${tr('Wie viele Stunden willst du pro Woche in dieses Ziel stecken? Gemessen wird dein Einsatz, nicht das Ergebnis.','How many hours per week do you want to put into this goal? Your effort is measured, not the outcome.')}</div>
  <label>${tr('Farbe','Colour')}</label><div class="colors">${COLORS.map(c=>`<button type="button" data-a="color" data-c="${c}" class="${c===editColor?'on':''}" style="background:${c}"></button>`).join('')}</div>
  <div class="actions">${g?`<button type="button" class="btn ghost" data-a="archive" data-g="${g.id}">${g.archived?tr('Reaktivieren','Reactivate'):tr('Archivieren','Archive')}</button><button type="button" class="btn danger" data-a="ask-del-goal" data-g="${g.id}">${tr('Löschen','Delete')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn" type="submit">${tr('Speichern','Save')}</button></div></form>`);
}
let MN=null;
function manualModal(gid,entryId){
  if(entryId){const e=(S.manual||[]).find(x=>x.id===entryId);if(!e)return;MN={id:e.id,g:e.g,day:e.day,min:Math.round(e.secs/60),note:e.note||''};}
  else MN={id:null,g:gid||(activeGoals()[0]||{}).id||'_none',day:todayKey(),min:30,note:''};
  renderManual();
}
function readManual(){const f=$('#manual-form');if(!f)return;const m=parseInt(f.querySelector('[name=min]').value,10);if(m>0)MN.min=m;MN.note=f.querySelector('[name=note]').value;const d=f.querySelector('[name=day]').value;if(d)MN.day=d;}
function renderManual(){
  const tk=todayKey(),gs=activeGoals();
  const dayChip=(k,l)=>`<button type="button" class="${MN.day===k?'on':''}" data-a="mn-day" data-v="${k}">${l}</button>`;
  const minChip=m=>`<button type="button" class="${MN.min===m?'on':''}" data-a="mn-min" data-v="${m}">${m<60?m+' min':(m/60)+' h'}</button>`;
  modal(`<h3>${MN.id?tr('Eintrag bearbeiten','Edit entry'):tr('Zeit nachtragen','Add time')}</h3>
  <form id="manual-form">
  <label>${tr('Ziel','Goal')}</label><div class="seg wrapseg">${gs.map(g=>`<button type="button" class="${MN.g===g.id?'on':''}" data-a="mn-goal" data-v="${g.id}"><i class="dot" style="background:${g.color};display:inline-block;margin-right:6px"></i>${esc(g.name)}</button>`).join('')}</div>
  <label>${tr('Tag','Day')}</label><div class="seg wrapseg">${dayChip(tk,tr('Heute','Today'))}${dayChip(shiftKey(tk,-1),tr('Gestern','Yesterday'))}${dayChip(shiftKey(tk,-2),tr('Vorgestern','2 days ago'))}</div>
  <input name="day" type="date" value="${MN.day}" max="${tk}" style="margin-top:8px">
  <label>${tr('Dauer','Duration')}</label><div class="seg wrapseg">${[15,30,45,60,90].map(minChip).join('')}</div>
  <div class="row" style="margin-top:8px"><input name="min" type="number" min="1" max="1440" inputmode="numeric" value="${MN.min}" style="width:110px"><span class="small">${tr('Minuten','minutes')}</span></div>
  <label>${tr('Notiz (optional)','Note (optional)')}</label><input name="note" maxlength="80" placeholder="${tr('z. B. Lauf 10 km','e.g. 10 km run')}" value="${esc(MN.note)}">
  <div class="actions">${MN.id?`<button type="button" class="btn danger" data-a="mn-del">${tr('Löschen','Delete')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn" type="submit">${MN.id?tr('Speichern','Save'):tr('Eintragen','Add')}</button></div></form>`);
}
function addManual(g,day,secs,note){const e={id:uid(),g,day,secs,note:note||'',at:Date.now()};S.manual=S.manual||[];S.manual.push(e);checkMilestones();save();render();return e;}

// ================= Ereignisse =================
let prevTab='heute';
function setTab(t){if(t==='einstellungen'&&tab==='einstellungen'){t=prevTab;}if((t==='einstellungen'||t==='hilfe')&&tab!=='einstellungen'&&tab!=='hilfe')prevTab=tab;tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);if(t==='woche'){const c=$('#col-today');if(c&&window.innerWidth<820)c.scrollIntoView({inline:'start',block:'nearest'});}}
const EXTRA_ACTIONS={};
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){setTab(nb.dataset.tab);return;}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,gid=el.dataset.g,tid=el.dataset.t;
  if(a==='close-bg'&&e.target!==el)return;
  const tk=todayKey();
  const T=()=>S.tasks.find(x=>x.id===tid);
  switch(a){
    case 'tab':setTab(el.dataset.tab);break;
    case 'gpick':goalPicker(el.closest('form'));break;
    case 'gpick-set':{const v=el.dataset.v;lastGoal=v;if(pickForm&&document.body.contains(pickForm)){const inp=pickForm.querySelector('.add-goal');if(inp)inp.value=v;const b=pickForm.querySelector('.gpick');const g=goal(v)||NONE();if(b){b.querySelector('i').style.background=g.color;b.querySelector('span').textContent=g.name;}const ti=pickForm.querySelector('input:not([type=hidden])');closeModal();if(ti&&!ti.value)ti.focus();}else closeModal();break;}
    case 'back':setTab(tab==='hilfe'?'einstellungen':prevTab);break;
    case 'play':startTimer(tid);break;
    case 'stop':stopTimer();break;
    case 'focus-go':{const n=focusQueue()[0];if(n){S.running={goalId:n.goalId,taskId:n.id,start:Date.now()};save();}setTab('fokus');break;}
    case 'done':completeTask(tid,false);break;
    case 'focus-done':completeTask(tid,true);break;
    case 'reopen':reopenTask(tid);break;
    case 'later':{const t=T();if(!t)break;if(S.running&&S.running.taskId===tid)stopTimer(true);t.date=t.date<tk?tk:t.date;t.order=nextOrder(tk);save();render();break;}
    case 'up':case 'down':{const all=dayTasks(tk);const list=el.dataset.list==='o'?all.filter(t=>!isGoalTask(t)):all.filter(isGoalTask);moveInList(tid,a==='up'?-1:1,list);break;}
    case 'del-task':if(S.running&&S.running.taskId===tid)stopTimer(true);S.tasks=S.tasks.filter(x=>x.id!==tid);save();render();break;
    case 'move':{const t=T();if(!t)break;const nk=shiftKey(t.date<tk?tk:t.date,+el.dataset.d);t.date=nk;t.order=nextOrder(nk);save();render();break;}
    case 'to-ablage':{const t=T();if(!t)break;if(S.running&&S.running.taskId===tid)stopTimer(true);t.date=null;t.order=nextOrder(null);save();render();toast(tr('In die Ablage gelegt','Moved to backlog'));break;}
    case 'to-today':{const t=T();if(!t)break;t.date=tk;t.order=nextOrder(tk);save();render();toast(tr('Für heute eingeplant','Planned for today'));break;}
    case 'goto-ablage':tab='woche';weekOff=0;render();window.scrollTo(0,0);{const c=$('#col-ablage');if(c)c.scrollIntoView({inline:'start',block:'nearest'});}break;
    case 'toggle-other':showOther=!showOther;render();break;
    case 'week':weekOff=+el.dataset.d===0?0:weekOff+(+el.dataset.d);render();break;
    case 'rev':revOff=+el.dataset.d===0?0:Math.min(0,revOff+(+el.dataset.d));render();break;
    case 'review-go':revOff=weekOffsetOf(el.dataset.w);setTab('rueckblick');break;
    case 'review-dismiss':{S.prefs=S.prefs||{};S.prefs.dismissed=Object.assign({},S.prefs.dismissed||{},{[el.dataset.w]:true});save();render();break;}
    case 'rs-review':restartModal(true);break;
    case 'rs-all-ablage':{const o=S.tasks.filter(t=>!t.done&&t.date&&t.date<tk);let n=nextOrder(null);o.forEach(t=>{t.date=null;t.order=n++;});save();closeModal();render();toast(tr(`${o.length} Aufgaben in der Ablage. Neuer Tag, neuer Anfang.`,`${o.length} tasks in the backlog. New day, fresh start.`));break;}
    case 'rs-keep':closeModal();break;
    case 'rs-one':{const t=T();if(!t)break;const v=el.dataset.v;if(v==='today'){t.date=tk;t.order=nextOrder(tk);}else if(v==='ablage'){t.date=null;t.order=nextOrder(null);}else{S.tasks=S.tasks.filter(x=>x.id!==tid);}save();render();restartModal(true);break;}
    case 'set':{const k=el.dataset.k;let v=el.dataset.v;if(k==='weekStart')v=+v;if(k==='review')v=v==='true';S.prefs=S.prefs||{};S.prefs[k]=v;save();render();break;}
    case 'avatar-remove':S.profile=S.profile||{};delete S.profile.avatar;save();render();break;
    case 'export':doExport();break;
    case 'do-import':if(window._imp){if(S.running)stopTimer(true);const keepP=S.prefs,keepPr=S.profile;S=normalize(window._imp);if(!Object.keys(S.prefs).length)S.prefs=keepP;if(!Object.keys(S.profile).length)S.profile=keepPr;window._imp=null;save();closeModal();render();toast(tr('Sicherung geladen','Backup restored'));}break;
    case 'reset-ask':modal(`<h3>${tr('Wirklich alles löschen?','Really delete everything?')}</h3><div class="small" style="line-height:1.5">${tr('Alle Ziele, Aufgaben, Zeiten und Reflexionen werden gelöscht. Profil und Einstellungen bleiben. Tipp: Vorher eine Sicherung machen.','All goals, tasks, times and reflections will be deleted. Profile and settings stay. Tip: make a backup first.')}</div><div class="actions"><button class="btn ghost" data-a="export">${tr('Erst sichern','Back up first')}</button><span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn danger" data-a="reset-do">${tr('Alles löschen','Delete everything')}</button></div>`);break;
    case 'reset-do':{const p=S.prefs,pr=S.profile,m=S.meta;S=EMPTY();S.prefs=p;S.profile=pr;S.meta=m;save();closeModal();setTab('heute');toast(tr('Alles gelöscht. Neuer Anfang.','Everything deleted. Fresh start.'));break;}
    case 'jump':{const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'top':window.scrollTo({top:0,behavior:'smooth'});break;
    case 'new-goal':goalModal(null);break;
    case 'edit-goal':goalModal(goal(gid));break;
    case 'manual':manualModal(gid);break;
    case 'mn-new':manualModal(null);break;
    case 'mn-edit':manualModal(null,el.dataset.id);break;
    case 'mn-goal':readManual();MN.g=el.dataset.v;renderManual();break;
    case 'mn-day':readManual();MN.day=el.dataset.v;renderManual();break;
    case 'mn-min':readManual();MN.min=+el.dataset.v;renderManual();break;
    case 'mn-del':S.manual=(S.manual||[]).filter(x=>x.id!==MN.id);closeModal();save();render();toast(tr('Eintrag gelöscht','Entry deleted'));break;
    case 'quick':{const g=goal(gid);const m=+el.dataset.m;const e=addManual(gid,todayKey(),m*60,'');toast(`${tr(`${m} min für „${esc(g.name)}“ eingetragen`,`${m} min added to “${esc(g.name)}”`)} · <button data-a="mn-undo" data-id="${e.id}" style="text-decoration:underline;color:inherit;font-weight:600">${tr('Rückgängig','Undo')}</button>`);break;}
    case 'mn-undo':S.manual=(S.manual||[]).filter(x=>x.id!==el.dataset.id);save();render();$('#toast-root').innerHTML='';break;
    case 'color':editColor=el.dataset.c;document.querySelectorAll('.colors button').forEach(b=>b.classList.toggle('on',b.dataset.c===editColor));break;
    case 'archive':{const g=goal(gid);g.archived=!g.archived;if(g.archived&&S.running&&S.running.goalId===gid)stopTimer(true);save();closeModal();render();break;}
    case 'ask-del-goal':{const g=goal(gid);modal(`<h3>${tr('Ziel löschen?','Delete goal?')}</h3><div class="small">${tr(`„${esc(g.name)}“ mit allen Aufgaben und erfassten Zeiten wird endgültig gelöscht. Wenn du die Zeiten behalten willst, archiviere das Ziel lieber.`,`“${esc(g.name)}” with all its tasks and tracked time will be deleted permanently. If you want to keep the time, archive the goal instead.`)}</div><div class="actions"><span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn danger" data-a="del-goal" data-g="${gid}">${tr('Löschen','Delete')}</button></div>`);break;}
    case 'del-goal':if(S.running&&S.running.goalId===gid)S.running=null;S.goals=S.goals.filter(g=>g.id!==gid);S.tasks=S.tasks.filter(t=>t.goalId!==gid);S.sessions=S.sessions.filter(x=>x.g!==gid);S.manual=(S.manual||[]).filter(x=>x.g!==gid);delete S.log[gid];save();closeModal();render();break;
    case 'close':case 'close-bg':closeModal();break;
    default:if(EXTRA_ACTIONS[a])EXTRA_ACTIONS[a](el);
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.classList.contains('add-goal'))lastGoal=t.value;

const WD_NAMES=[['sonntag','sunday','so','sun'],['montag','monday','mo','mon'],['dienstag','tuesday','di','tue'],['mittwoch','wednesday','mi','wed'],['donnerstag','thursday','do','thu'],['freitag','friday','fr','fri'],['samstag','saturday','sa','sat']];
function dayWord(w){
  w=w.toLowerCase().replace(/[.,;!]+$/,'');const tk=todayKey();
  if(w==='heute'||w==='today')return tk;
  if(w==='morgen'||w==='tomorrow')return shiftKey(tk,1);
  if(w==='übermorgen'||w==='uebermorgen')return shiftKey(tk,2);
  if(w==='ablage'||w==='backlog'||w==='später'||w==='later')return null;
  const i=WD_NAMES.findIndex(n=>n.includes(w));
  if(i<0)return undefined;
  const now=parseKey(tk).getDay();return shiftKey(tk,(i-now+7)%7);
}
function goalWord(w){const n=w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(!n)return null;const gs=activeGoals();const key=g=>g.name.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');return gs.find(g=>key(g)===n)||gs.find(g=>key(g).startsWith(n))||null;}
// Zeile zerlegen: Aufzählungszeichen weg, #Ziel irgendwo, Tag nur am Zeilenende
function parseLine(line){
  let s=line.replace(/^\s*(?:[-*•–]\s*)?(?:\[[ xX]?\]\s*)?/,'').trim();let day,g;
  s=s.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,(m,sp,w)=>{const x=goalWord(w);if(x&&!g){g=x.id;return sp;}return m;}).replace(/\s{2,}/g,' ').trim();
  for(let k=0;k<2;k++){const m=s.match(/\s(\S+)$/);if(!m)break;const d=dayWord(m[1]);if(d===undefined||day!==undefined)break;day=d;s=s.slice(0,m.index).trim();}
  return {title:s.slice(0,140),day,g};
}

const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64url(crypto.getRandomValues(new Uint8Array(n)));
async function pkce(){const v=rnd(48);const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));return {v,ch};}
async function startAuth(p,silent){
  const cid=clientId(p);if(!cid)return wizardOpen(p);
  const state=rnd(16);const st={p,state,silent:!!silent,at:Date.now(),tab};
  let u;
  if(p==='dropbox'){const k=await pkce();st.v=k.v;u=new URL('https://www.dropbox.com/oauth2/authorize');Object.entries({client_id:cid,response_type:'code',code_challenge:k.ch,code_challenge_method:'S256',redirect_uri:redirectUri(),token_access_type:'offline',state}).forEach(([a,b])=>u.searchParams.set(a,b));}

async function formPost(url,params){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});

}
async function finishAuth(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
  const src=q.has('code')||q.has('error')?q:(h.has('access_token')||h.has('error'))?h:null;
  if(!src)return false;
  let st=null;try{st=JSON.parse(localStorage.getItem(OAUTH_KEY)||'null');}catch(e){}
  localStorage.removeItem(OAUTH_KEY);
  history.replaceState(null,'',location.pathname+(st&&st.tab?'#'+st.tab:''));
  if(st&&st.tab&&TABS.includes(st.tab))tab=st.tab;
  if(!st||src.get('state')!==st.state){SY.err=tr('Anmeldung konnte nicht zugeordnet werden. Bitte nochmal versuchen.','Sign-in could not be matched. Please try again.');return true;}
  if(src.has('error')){
    if(st.silent){SY.needsAuth=true;return true;}
    SY.err=tr('Anmeldung abgebrochen','Sign-in cancelled');return true;
  }
  const p=st.p,cid=clientId(p),prev=SY.cfg.type===p?SY.cfg:{};

  else if(p==='onedrive'){const t=await formPost('https://login.microsoftonline.com/common/oauth2/v2.0/token',{client_id:cid,grant_type:'authorization_code',code:src.get('code'),redirect_uri:redirectUri(),code_verifier:st.v,scope:'Files.ReadWrite.AppFolder offline_access'});SY.cfg={type:p,refresh:t.refresh_token,access:t.access_token,exp:Date.now()+(t.expires_in-60)*1000};}
  else if(p==='google'){SY.cfg={type:p,access:src.get('access_token'),exp:Date.now()+((+src.get('expires_in')||3600)-60)*1000,fileId:prev.fileId};}
  else if(p==='pcloud'){SY.cfg={type:p,access:src.get('access_token'),host:src.get('hostname')||'api.pcloud.com'};}

async function accessToken(){
  const c=SY.cfg,cid=clientId(c.type);
  if(c.type==='pcloud')return c.access;
  if(c.access&&(!c.exp||c.exp>Date.now()))return c.access;
  if(c.type==='google')throw new AuthError('expired');
  try{
    const url=c.type==='dropbox'?'https://api.dropboxapi.com/oauth2/token':'https://login.microsoftonline.com/common/oauth2/v2.0/token';
    const params=c.type==='dropbox'?{grant_type:'refresh_token',refresh_token:c.refresh,client_id:cid}:{grant_type:'refresh_token',refresh_token:c.refresh,client_id:cid,scope:'Files.ReadWrite.AppFolder offline_access'};
    const t=await formPost(url,params);
    c.access=t.access_token;c.exp=Date.now()+(t.expires_in-60)*1000;if(t.refresh_token)c.refresh=t.refresh_token;saveCfg();return c.access;
  }catch(e){if(e instanceof AuthError)throw e;throw e;}
}
async function api(url,opt){
  opt=opt||{};const tok=await accessToken();
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+tok})}));
  if(r.status===401){if(SY.cfg.type!=='pcloud'){SY.cfg.access=null;SY.cfg.exp=0;saveCfg();}throw new AuthError('401');}
  return r;
}

async function syncPull(){
  const p=provider();if(!p||SY.busy||SY.needsAuth)return;
  SY.busy=true;SY.err=null;showSync();
  try{
    const remote=await p.get();
    const mine=localStamp();
    const hasLocal=S.goals.length||S.tasks.length;
    if(!SY.cfg.synced&&remote&&remote.state&&hasLocal&&(remote.state.goals||[]).length){
      SY.busy=false;SY.pendingRemote=remote;showSync();
      modal(`<h3>${tr('Welche Daten behalten?','Which data should be kept?')}</h3><div class="small" style="line-height:1.5">${tr(`In ${provName()} liegen schon Motus-Daten (${remote.state.goals.length} Ziele, ${(remote.state.tasks||[]).length} Aufgaben), und auf diesem Gerät auch (${S.goals.length} Ziele, ${S.tasks.length} Aufgaben). Welche sollen ab jetzt gelten?`,`${provName()} already has Motus data (${remote.state.goals.length} goals, ${(remote.state.tasks||[]).length} tasks), and so does this device (${S.goals.length} goals, ${S.tasks.length} tasks). Which should apply from now on?`)}</div><div class="actions"><button class="btn ghost" data-a="sync-keep-local">${tr('Dieses Gerät','This device')}</button><span class="sp"></span><button class="btn" data-a="sync-keep-remote">${tr('Aus ','From ')}${provName()}</button></div>`);
      return;
    }
    if(remote&&remote.state&&(remote.savedAt||0)>mine){
      S=normalize(remote.state);localSave();setStamp(remote.savedAt);applyTheme();softRender();
    }else if(!remote||(remote.savedAt||0)<mine){
      await p.put(JSON.stringify({app:'motus',v:3,savedAt:mine||Date.now(),state:S}));
      if(!mine)setStamp(Date.now());
    }
    SY.last=Date.now();if(!SY.cfg.synced){SY.cfg.synced=true;saveCfg();}
  }catch(e){handleErr(e);}
  SY.busy=false;showSync();if(tab==='einstellungen'&&!typing())render();
}
async function syncPush(){
  const p=provider();if(!p||SY.needsAuth)return;
  if(SY.busy){schedulePush();return;}
  SY.busy=true;SY.err=null;showSync();
  try{await p.put(JSON.stringify({app:'motus',v:3,savedAt:localStamp(),state:S}));SY.last=Date.now();}
  catch(e){handleErr(e);}
  SY.busy=false;showSync();
}
function schedulePush(){if(SY.cfg.type==='none')return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>{SY.timer=null;syncPush();},2000);}
function markDirty(){setStamp(Date.now());schedulePush();}
async function syncInit(){
  try{await finishAuth();}catch(e){SY.err=errText(e);}
  showSync();render();
  if(SY.cfg.type!=='none'){
    if(SY.cfg.type==='google'&&!(SY.cfg.access&&SY.cfg.exp>Date.now())){SY.needsAuth=true;showSync();maybeSilentAuth();}
    else syncPull();
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SY.timer){clearTimeout(SY.timer);SY.timer=null;syncPush();}}else syncPull();});
  window.addEventListener('online',syncPull);
  setInterval(()=>{if(!document.hidden&&!SY.timer)syncPull();},120000);
}
