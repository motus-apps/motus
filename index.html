  if(WZ.step===0)return modal(`<h3>${tr('Mit','Connect')} ${name}${tr(' verbinden','')}</h3><div class="small" style="line-height:1.55">${tr(`Motus speichert eine einzige Datei <b>motus.json</b> ${where}. Auf deine anderen Dateien hat Motus keinen Zugriff. Du wirst gleich zu ${name} weitergeleitet, meldest dich an, bestätigst und landest wieder hier.`,`Motus saves a single file <b>motus.json</b> ${where}. Motus has no access to your other files. You’ll be taken to ${name}, sign in, confirm and land back here.`)}${p==='google'?'<br><br>'+tr('Hinweis: Google erlaubt Web-Apps nur kurze Anmeldungen. Motus meldet sich deshalb ab und zu im Hintergrund neu an.','Note: Google only allows short sign-ins for web apps, so Motus re-signs in in the background now and then.'):''}${p==='onedrive'?'<br><br>'+tr('Hinweis: Microsoft erneuert die Anmeldung einmal am Tag. Meist merkst du davon nur ein kurzes Neuladen.','Note: Microsoft renews the sign-in once a day. Usually you just notice a quick reload.'):''}</div>${secure?'':`<div class="hint" style="margin-top:10px;color:var(--danger)">${tr('Das funktioniert nur, wenn Motus über https:// läuft.','This only works when Motus runs over https://.')}</div>`}
    <div class="actions">${CLOUD_IDS[p]?'':`<button class="btn ghost" data-a="wz-goto" data-v="1">${tr('Client-ID ändern','Change client ID')}</button>`}<span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn gold" data-a="wz-auth" ${secure?'':'disabled'}>${tr('Weiter zu','Continue to')} ${name}</button></div>`);
  return modal(`${steps(2,0)}<h3>${tr('Einmalige Einrichtung','One-time setup')}: ${name}</h3><div class="small" style="line-height:1.55">${tr(`Motus muss einmalig bei ${name} angemeldet werden. Das ist kostenlos und dauert ein paar Minuten, am besten am Computer. Danach kannst du dich auf allen Geräten einfach mit ${name} anmelden.`,`Motus needs to be registered with ${name} once. It’s free and takes a few minutes, best done on a computer. After that you can simply sign in with ${name} on all devices.`)}</div>
    ${devGuide(p)}
    <form id="cid-form"><label>${p==='dropbox'?'App key':'Client ID'}</label><input name="cid" required autocomplete="off" value="${esc(clientId(p))}">
    <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn gold" type="submit">${tr('Speichern & anmelden','Save & sign in')}</button></div></form>`);
}
Object.assign(EXTRA_ACTIONS,{
  'wz-start'(el){wizardOpen(el.dataset.v);},
  'wz-goto'(el){WZ.step=+el.dataset.v;wizard();},
  'wz-auth'(){startAuth(WZ.p,false);},
  async 'wz-copy'(el){try{await navigator.clipboard.writeText(el.dataset.v);toast(tr('Kopiert','Copied'));}catch(e){toast(tr('Bitte von Hand kopieren','Please copy manually'));}},
  'sync-now'(){SY.err=null;syncPull();},
  'sync-reauth'(){startAuth(SY.cfg.type,false);},
  'sync-off'(){modal(`<h3>${tr('Synchronisierung trennen?','Disconnect sync?')}</h3><div class="small">${tr(`Deine Daten bleiben auf diesem Gerät und in der Datei bei ${provName()} erhalten. Es wird nur nicht mehr abgeglichen.`,`Your data stays on this device and in the file at ${provName()}. It just won’t be synced anymore.`)}</div><div class="actions"><span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn danger" data-a="sync-off-ok">${tr('Trennen','Disconnect')}</button></div>`);},
  'sync-off-ok'(){SY.cfg={type:'none'};SY.err=null;SY.last=null;SY.needsAuth=false;saveCfg();closeModal();showSync();render();},
  'sync-keep-remote'(){const r=SY.pendingRemote;SY.pendingRemote=null;if(r){S.running=null;S=normalize(r.state);localSave();setStamp(r.savedAt||Date.now());}SY.cfg.synced=true;saveCfg();closeModal();SY.last=Date.now();showSync();applyTheme();render();},
  'sync-keep-local'(){SY.pendingRemote=null;SY.cfg.synced=true;saveCfg();setStamp(Date.now());closeModal();syncPush().then(render);}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='cid-form'){e.preventDefault();e.stopImmediatePropagation();const v=new FormData(f).get('cid').trim();if(v){setClientId(WZ.p,v);startAuth(WZ.p,false);}}
},true);
// Hinweis bei abgelaufener Anmeldung, einmal pro Sitzung
let reauthHinted=false;
setInterval(()=>{if(SY.needsAuth&&!reauthHinted&&!document.hidden&&!$('#modal-root').innerHTML){reauthHinted=true;toast(`${tr(`${provName()}: Anmeldung abgelaufen`,`${provName()}: sign-in expired`)} · <button data-a="sync-reauth" style="text-decoration:underline;color:inherit;font-weight:600">${tr('Neu anmelden','Sign in')}</button>`,8000);}},5000);

initStore();
syncInit();
takeShared();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
