const STORAGE_HELP=()=>IS_PWA?tr(`Zuerst nur in diesem Browser. Unter <b>Einstellungen → Synchronisierung</b> (dein Profilbild oben rechts) kannst du deinen eigenen Cloud-Speicher verbinden: <b>Dropbox, Google Drive, OneDrive oder pCloud</b>. Motus legt dort nur eine Datei <b>motus.json</b> in einem eigenen App-Ordner an und sieht deine anderen Dateien nicht. Darüber gleichen sich deine Geräte ab: beim Öffnen, nach jeder Änderung und alle zwei Minuten. Bei gleichzeitigen Änderungen gewinnt die neuere Version. Einen Motus-Server gibt es nicht.`,`At first only in this browser. Under <b>Settings → Sync</b> (your profile picture top right) you can connect your own cloud storage: <b>Dropbox, Google Drive, OneDrive or pCloud</b>. Motus only creates a single file <b>motus.json</b> in its own app folder and cannot see your other files. Your devices sync through it: on opening, after every change and every two minutes. If two devices change things at the same time, the newer version wins. There is no Motus server.`):'';
function viewHelp(){
  const sec=(id,title,body)=>`<div class="card wiki" id="${id}" style="scroll-margin-top:80px"><h3>${title}</h3>${body}<button class="totop" data-a="top">↑ ${tr('nach oben','back to top')}</button></div>`;
  const pr=(n,title,body,where)=>`<div class="pr" style="margin:14px 0"><div class="num">${n}</div><div><b>${title}</b><p style="margin:4px 0">${body}</p><div class="where">→ ${where}</div></div></div>`;
  const L=(de,en)=>tr(de,en);
  let h=`<div class="pagehead"><h1>${L('Anleitung','Guide')}</h1><button class="btn ghost sm" data-a="back">✕ ${L('Schließen','Close')}</button></div>
  <div class="card wiki"><div class="lead">${L('Motus hilft dir, deine Zeit in das zu stecken, was dir wirklich wichtig ist. Du verbindest deine großen Ziele mit dem, was du heute tust, und siehst, wie viele Stunden tatsächlich hineinfließen.','Motus helps you spend your time on what really matters to you. You connect your big goals with what you do today, and see how many hours actually go into them.')}</div>
  <p>${L('Motus ist kein Kalender, in den du jede halbe Stunde verplanst. Du entscheidest morgens, <b>was</b> heute dran ist und in <b>welcher Reihenfolge</b>. Dann arbeitest du eine Aufgabe nach der anderen ab, und es dauert so lange, wie es dauert.','Motus is not a calendar where you schedule every half hour. Each morning you decide <b>what</b> matters today and in <b>which order</b>. Then you work through one task after another, and it takes as long as it takes.')}</p></div>
  <div class="toc">${[['w-grund',L('Grundsätze','Principles')],['w-prinzipien',L('Die 6 Prinzipien','The 6 principles')],['w-start',L('Erste Schritte','Getting started')],['w-seiten',L('Die Seiten','The pages')],['w-routine',L('Routinen','Routines')],['w-begriffe',L('Begriffe','Glossary')],['w-faq',L('Häufige Fragen','FAQ')]].map(([id,t])=>`<button data-a="jump" data-to="${id}">${t}</button>`).join('')}</div>`;
  h+=sec('w-grund',L('Grundsätze von Motus','Motus principles'),`<ol>
    <li><b>${L('Motus macht kein schlechtes Gewissen.','Motus never makes you feel guilty.')}</b> ${L('Keine Strafen, keine Vorwürfe, keine Serien, die reißen können.','No penalties, no reproaches, no streaks that can break.')}</li>
    <li><b>${L('Pausen sind normal.','Breaks are normal.')}</b> ${L('Wenn du das Tool nicht nutzt, hat das einen Grund, und der liegt nicht bei dir. Nach einer Pause gibt es ein freundliches Willkommen und einen leichten Neustart.','If you don’t use the tool, there is a reason, and it isn’t you. After a break you get a friendly welcome and an easy fresh start.')}</li>
    <li><b>${L('Belohnt wird echter Fortschritt.','Real progress is what counts.')}</b> ${L('Gezählt werden investierte Stunden in deine Ziele, nicht Häkchen oder tägliches Öffnen.','What counts is hours invested in your goals, not checkmarks or daily opens.')}</li>
    <li><b>${L('Du bestimmst.','You decide.')}</b> ${L('Erinnerungen sind Einladungen und lassen sich abschalten.','Reminders are invitations and can be switched off.')}</li>
    <li><b>${L('Deine Daten gehören dir.','Your data belongs to you.')}</b> ${L('Kein fremder Server, kein Tracking.','No third-party server, no tracking.')}</li></ol>`);
  h+=sec('w-prinzipien',L('Die 6 Prinzipien','The 6 principles'),
    pr(1,L('Nach Tagen planen, nicht nach Stunden','Plan by day, not by hour'),L('Feste Zeitblöcke stressen und brechen bei jeder Unterbrechung zusammen. Verteile Aufgaben stattdessen auf Tage und bring sie in eine Reihenfolge nach Wichtigkeit.','Fixed time blocks are stressful and collapse with every interruption. Instead, spread tasks across days and order them by importance.'),L('Heute, Woche, Ablage','Today, Week, Backlog'))+
    pr(2,L('Immer nur eine Aufgabe sehen','See only one task at a time'),L('Wer ständig sieht, was noch alles ansteht, verliert Energie für das Jetzt. Im Fokus siehst du nur die aktuelle Aufgabe. Ist sie erledigt, kommt die nächste.','Constantly seeing everything ahead drains energy for the present. In Focus you only see the current task. When it’s done, the next one appears.'),L('Fokus','Focus'))+
    pr(3,L('Messen, wohin die Zeit fließt','Measure where your time goes'),L('Was man misst, wird besser. Jede Minute läuft auf eine Aufgabe und damit auf ein Ziel.','What gets measured gets better. Every minute goes to a task and therefore to a goal.'),L('Timer bei jeder Aufgabe, Nachtragen, Rückblick','Timer on every task, manual logging, Review'))+

    pr(5,L('Input-Ziele statt Ergebnis-Ziele','Input goals instead of outcome goals'),L('„Diese Woche werde ich fertig“ scheitert oft an Dingen, die du nicht beeinflusst. „Diese Woche investiere ich 8 Stunden“ hast du selbst in der Hand. Gezählt werden nur Ziel-Stunden.','“I’ll finish this week” often fails because of things outside your control. “I’ll invest 8 hours this week” is in your hands. Only goal hours are counted.'),L('Ziele (Input-Ziel) und Rückblick','Goals (input goal) and Review'))+
    pr(6,L('Vertikale Kohärenz und feste Reflexion','Vertical coherence and regular reflection'),L('Was dir im Leben wichtig ist, deine Ziele und die einzelne Stunde sollten zusammenpassen. Prüfe das jede Woche. Passt es nicht, änderst du deine Ziele oder deinen Alltag.','What matters to you in life, your goals and the single hour should fit together. Check this every week. If it doesn’t fit, change your goals or your routine.'),L('„Warum“ bei jedem Ziel, Rückblick','“Why” on every goal, Review')));
  h+=sec('w-start',L('Erste Schritte','Getting started'),`<ol>
    <li>${L('<b>Profil einrichten</b>: Tippe oben rechts auf das Profilbild. Dort findest du Name, Bild, Design, Sprache und Synchronisierung.','<b>Set up your profile</b>: tap the profile picture top right. There you find name, picture, theme, language and sync.')}</li>
    <li>${L('<b>Ein bis drei Ziele anlegen</b>, jeweils mit Farbe und einem <b>Input-Ziel</b> (Stunden pro Woche).','<b>Create one to three goals</b>, each with a colour and an <b>input goal</b> (hours per week).')}</li>
    <li>${L('<b>Die Woche grob planen</b> und Ideen ohne Tag in die <b>Ablage</b> legen.','<b>Roughly plan the week</b> and put ideas without a day into the <b>backlog</b>.')}</li>
    <li>${L('<b>Morgens unter Heute die Reihenfolge festlegen</b>, dann <b>Fokus starten</b>.','<b>Set the order under Today each morning</b>, then <b>start focus</b>.')}</li></ol>`);
  h+=sec('w-seiten',L('Die Seiten','The pages'),`
    <details open><summary>${L('Heute','Today')}</summary><p>${L('Deine Aufgaben für heute in der Reihenfolge, in der du sie erledigen willst. Die oberste ist golden umrandet, sie ist als Nächstes dran.','Your tasks for today in the order you want to do them. The top one has a gold outline, it’s up next.')}</p><ul>
      <li>${L('<b>Neue Aufgabe:</b> Text eingeben, Ziel wählen, „+“.','<b>New task:</b> type, choose a goal, “+”.')}</li>
      <li>${L('<b>Reihenfolge:</b> mit ⌃ ⌄ verschieben, am Computer auch per Ziehen.','<b>Order:</b> move with ⌃ ⌄, or drag on a computer.')}</li>
      <li>${L('<b>▶</b> startet den Timer, <b>❚❚</b> pausiert ihn. Kästchen antippen heißt erledigt, mit ↶ holst du eine Aufgabe zurück.','<b>▶</b> starts the timer, <b>❚❚</b> pauses it. Tapping the box marks it done, ↶ brings a task back.')}</li>
      <li>${L('Nicht erledigte Aufgaben wandern auf den nächsten Tag („übernommen“). Warst du 3 Tage oder länger weg, bietet Motus dir einen <b>Neustart</b> an, statt dich mit einem Berg zu begrüßen.','Unfinished tasks move to the next day (“carried over”). If you were away for 3 days or more, Motus offers a <b>fresh start</b> instead of greeting you with a pile.')}</li>
      <li>${L('<b>Aufgaben ohne Ziel</b> stehen eingeklappt unten, damit sie nicht ablenken.','<b>Tasks without a goal</b> are collapsed at the bottom so they don’t distract you.')}</li></ul></details>
    <details><summary>${L('Woche & Ablage','Week & backlog')}</summary><p>${L('Eine Spalte pro Tag, ganz links die <b>Ablage</b> für alles ohne festen Tag. Mit ‹ › verschiebst du um einen Tag, mit dem Kisten-Symbol in die Ablage, mit dem Kalender-Symbol aus der Ablage auf heute. Am Computer ziehst du Karten einfach dorthin, wo sie hin sollen.','One column per day, with the <b>backlog</b> on the far left for everything without a fixed day. ‹ › moves a task by one day, the box icon moves it to the backlog, the calendar icon moves it from the backlog to today. On a computer, just drag cards where you want them.')}</p></details>
    <details><summary>${L('Schnell erfassen & bearbeiten','Quick capture & editing')}</summary><p>${L('Der goldene <b>+</b>-Knopf (am Computer die Taste <b>N</b>) öffnet ein Feld für neue Aufgaben. Ohne weitere Angabe landen sie in der <b>Ablage</b>, sortiert wird später. Eine Zeile pro Aufgabe, so kannst du ganze Listen einfügen. Schreibst du „heute“, „morgen“ oder einen Wochentag wie „fr“ ans Zeilenende, wird die Aufgabe direkt eingeplant. „#Sport“ ordnet sie dem Ziel Sport zu. Aus anderen Apps kommst du über das Teilen-Menü, einen Kurzbefehl oder ein Lesezeichen herein, siehe Einstellungen → Schnell erfassen. <b>Bearbeiten:</b> Tippe auf den Titel einer Aufgabe. Dann kannst du Text, Tag, Ziel und Notizen ändern oder sie löschen. <b>Links:</b> Adressen in Titel oder Notizen, auch kurz wie google.de, erscheinen als kleine Chips mit Symbol auf der Karte, etwa „Outlook-Mail“ oder „Teams-Nachricht“. So findest du mit einem Tipp zur Mail oder zum Dokument zurück.','The golden <b>+</b> button (on a computer the <b>N</b> key) opens a field for new tasks. Without further info they go to the <b>backlog</b>, to be sorted later. One line per task, so you can paste whole lists. Put “today”, “tomorrow” or a weekday like “fri” at the end of a line to plan it right away. “#Sport” assigns it to the goal Sport. From other apps use the share menu, a shortcut or a bookmark, see Settings → Quick capture. <b>Editing:</b> tap a task’s title to change its text, day, goal and notes, or to delete it. <b>Links:</b> addresses in the title or notes, even short ones like google.de, appear as small chips with an icon on the card, e.g. “Outlook mail” or “Teams message”. One tap takes you back to the mail or document.')}</p></details>
    <details><summary>${L('Fokus','Focus')}</summary><p>${L('Nur eine Aufgabe, mit Timer und Notizen. <b>✓ Erledigt</b> hakt sie ab und startet direkt die nächste. <b>Später</b> schiebt sie ans Ende.','Just one task, with timer and notes. <b>✓ Done</b> checks it off and starts the next one right away. <b>Later</b> moves it to the end.')}</p></details>

    <details><summary>${L('Ziele & Weg zur Sonne','Goals & path to the sun')}</summary><p>${L('Jedes Ziel hat einen <b>Weg zur Sonne</b>. Jede Stunde bringt dich ein Stück weiter zur nächsten <b>Etappe</b> (5, 10, 25, 50, 100 Stunden …). Erreichst du eine, feiert Motus kurz mit dir. Mit <b>+30 min</b>, <b>+60 min</b> oder <b>Andere…</b> trägst du Zeit ohne Timer nach, auch für vergangene Tage. Archivieren beendet ein Ziel, die Stunden bleiben erhalten.','Each goal has a <b>path to the sun</b>. Every hour moves you closer to the next <b>milestone</b> (5, 10, 25, 50, 100 hours …). When you reach one, Motus briefly celebrates with you. Use <b>+30 min</b>, <b>+60 min</b> or <b>Other…</b> to log time without the timer, also for past days. Archiving ends a goal, the hours are kept.')}</p></details>
    <details><summary>${L('Rückblick','Review')}</summary><p>${L('Ziel-Stunden der Woche im Vergleich zur Vorwoche und zu deinen Input-Zielen. Darunter „So lief deine Woche“: farbige Blöcke zeigen, wann du woran gearbeitet hast, dazu nachgetragene Zeiten (bearbeitbar) und alles Erledigte. Dann vier Fragen zur Reflexion und die <b>Jahresübersicht</b>. Wenn du möchtest, erinnert dich Motus freundlich daran (Einstellungen).','Goal hours of the week compared to last week and your input goals. Below that, “How your week went”: coloured blocks show when you worked on what, plus manually added time (editable) and everything you finished. Then four reflection questions and the <b>year overview</b>. If you like, Motus gently reminds you (Settings).')}</p></details>
    <details><summary>${L('Einstellungen','Settings')}</summary><p>${L('Über dein Profilbild oben rechts: Name und Bild, Hell/Dunkel, Sprache, Wochenstart, Tagesbeginn, Rückblick-Erinnerung, Synchronisierung sowie Sichern, Laden und Löschen deiner Daten.','Via your profile picture top right: name and picture, light/dark, language, week start, start of day, review reminder, sync, and backing up, restoring and deleting your data.')}</p></details>`);
  h+=sec('w-routine',L('Tages- und Wochenroutine','Daily and weekly routine'),`
    <p><b>${L('Jeden Morgen (2 Minuten)','Every morning (2 minutes)')}</b></p><ul><li>${L('Heute öffnen, das Wichtige nach oben, Unwichtiges auf später oder in die Ablage.','Open Today, important things to the top, the rest to later or the backlog.')}</li><li>${L('Fokus starten.','Start focus.')}</li></ul>
    <p><b>${L('Tagsüber','During the day')}</b></p><ul><li>${L('Eine Aufgabe, Timer, fertig, die nächste. Kommt etwas dazwischen: Pause. Der Plan muss nicht umgebaut werden.','One task, timer, done, next. If something comes up: pause. No need to rebuild the plan.')}</li></ul>
    <p><b>${L('Einmal pro Woche (20 Minuten)','Once a week (20 minutes)')}</b></p><ul><li>${L('Rückblick: Zahlen anschauen, Fragen beantworten, Ziele prüfen, neue Woche grob verteilen.','Review: look at the numbers, answer the questions, check your goals, roughly plan the new week.')}</li><li>${L('Tipp: Mit jemandem durchgehen macht es verbindlicher.','Tip: going through it with someone makes it more binding.')}</li></ul>`);
  h+=sec('w-begriffe',L('Begriffe','Glossary'),`<dl>
    <dt>${L('Ziel','Goal')}</dt><dd>${L('Ein langfristiges Vorhaben, das dir wichtig ist. Am besten höchstens drei gleichzeitig.','A long-term pursuit that matters to you. Ideally no more than three at a time.')}</dd>
    <dt>${L('Aufgabe','Task')}</dt><dd>${L('Ein konkreter Schritt. Gehört zu einem Ziel oder steht unter „Ohne Ziel“.','A concrete step. Belongs to a goal or sits under “No goal”.')}</dd>
    <dt>${L('Ablage','Backlog')}</dt><dd>${L('Aufgaben und Ideen ohne festen Tag. Nichts geht verloren.','Tasks and ideas without a fixed day. Nothing gets lost.')}</dd>
    <dt>${L('Ziel-Stunden','Goal hours')}</dt><dd>${L('Zeit, die in Aufgaben zu deinen Zielen geflossen ist. Die wichtigste Zahl.','Time spent on tasks for your goals. The most important number.')}</dd>
    <dt>${L('Input-Ziel','Input goal')}</dt><dd>${L('Wie viele Stunden pro Woche du in ein Ziel investieren willst.','How many hours per week you want to invest in a goal.')}</dd>
    <dt>${L('Etappe','Milestone')}</dt><dd>${L('Eine Marke bei den gesamten Stunden eines Ziels, z. B. 50 Stunden.','A mark in a goal’s total hours, e.g. 50 hours.')}</dd>
    <dt>${L('Sonstiges','Other')}</dt><dd>${L('Zeit für Aufgaben ohne Ziel. Wird erfasst, zählt aber nicht zu den Ziel-Stunden.','Time for tasks without a goal. Tracked, but not counted as goal hours.')}</dd>
    <dt>${L('Nachgetragen','Added manually')}</dt><dd>${L('Zeit, die du ohne Timer einträgst. Im Rückblick sichtbar und änderbar.','Time you log without the timer. Visible and editable in Review.')}</dd>
</dl>`);
  h+=sec('w-faq',L('Häufige Fragen','FAQ'),`
    <details><summary>${L('Läuft der Timer weiter, wenn ich die App schließe?','Does the timer keep running when I close the app?')}</summary><p>${L('Ja. Gespeichert wird die Startzeit. Beim Öffnen stimmt die Zeit.','Yes. The start time is saved, so the time is right when you open it again.')}</p></details>
    <details><summary>${L('Ich habe vergessen, den Timer zu starten.','I forgot to start the timer.')}</summary><p>${L('Unter Ziele beim Ziel auf „+30 min“, „+60 min“ oder „Andere…“ tippen. Dort wählst du auch Gestern, Vorgestern oder ein Datum. Falsche Einträge korrigierst du im Rückblick unter „Nachgetragen“.','Under Goals, tap “+30 min”, “+60 min” or “Other…” on the goal. There you can also pick yesterday, the day before or a date. Fix wrong entries in Review under “Added manually”.')}</p></details>
    <details><summary>${L('Warum nur ein Timer gleichzeitig?','Why only one timer at a time?')}</summary><p>${L('Absichtlich: Du arbeitest immer nur an einer Sache.','On purpose: you only ever work on one thing.')}</p></details>
    <details><summary>${L('Warum gibt es keine Serien oder Punkte?','Why are there no streaks or points?')}</summary><p>${L('Weil sie Beschäftigung statt Fortschritt belohnen und Druck machen. Motus feiert stattdessen echte investierte Stunden.','Because they reward busyness over progress and create pressure. Motus celebrates real invested hours instead.')}</p></details>
    <details><summary>${L('Was passiert, wenn ich länger nicht da war?','What happens if I was away for a while?')}</summary><p>${L('Nach 3 Tagen Pause fragt Motus einmal, was mit den offenen Aufgaben passieren soll: durchgehen, alle in die Ablage oder behalten.','After a 3-day break Motus asks once what to do with open tasks: go through them, move all to the backlog, or keep them.')}</p></details>
    <details><summary>${L('Ich arbeite oft nach Mitternacht.','I often work past midnight.')}</summary><p>${L('In den Einstellungen kannst du den Tagesbeginn auf z. B. 4 Uhr legen. Dann zählt die Nacht noch zum Vortag.','In Settings you can set the start of the day to e.g. 4 am. The night then still counts for the previous day.')}</p></details>
    <details><summary>${L('Wo werden meine Daten gespeichert?','Where is my data stored?')}</summary><p>${STORAGE_HELP()}</p></details>
    <details><summary>${L('Wie lange bleiben erledigte Aufgaben sichtbar?','How long do finished tasks stay visible?')}</summary><p>${L('Erledigte Aufgaben 90 Tage, Sitzungen 180 Tage. Die Stunden pro Ziel bleiben dauerhaft.','Finished tasks 90 days, sessions 180 days. Hours per goal are kept permanently.')}</p></details>`);
  return h;
}

// ================= Dialoge =================
function modal(html){$('#modal-root').innerHTML=`<div class="modal-bg" data-a="close-bg"><div class="modal">${html}</div></div>`;const i=$('#modal-root input:not([type=file])');if(i&&!('ontouchstart' in window))setTimeout(()=>i.focus(),50);}
function closeModal(){$('#modal-root').innerHTML='';if(celebrateQueue){const h=celebrateQueue;celebrateQueue=null;modal(h);}}
let editColor=COLORS[0];
function goalModal(g){
  editColor=g?g.color:COLORS[S.goals.length%COLORS.length];
  modal(`<h3>${g?(isProj(g)?tr('Projekt bearbeiten','Edit project'):tr('Ziel bearbeiten','Edit goal')):tr('Neues Ziel oder Projekt','New goal or project')}</h3>
  ${g?'':`<details class="goalhelp" ${S.goals.length?'':'open'}><summary>${tr('Ziel oder Projekt?','Goal or project?')}</summary><div class="small kindhelp" style="line-height:1.55;margin-top:8px">
<div><b>${tr('Ziel','Goal')}</b> · ${tr('läuft dauerhaft, ohne Ende. Du steckst regelmäßig Zeit hinein, gemessen in <b>Stunden pro Woche</b>. Der Weg zur Sonne füllt sich mit deinen Stunden und feiert Etappen.','ongoing, no end. You invest time regularly, measured in <b>hours per week</b>. The path to the sun fills with your hours and celebrates milestones.')}<br><i>${tr('z. B. Sport, Spanisch lernen, Gitarre, Schreiben','e.g. sport, learning Spanish, guitar, writing')}</i></div>
<div style="margin-top:10px"><b>${tr('Projekt','Project')}</b> · ${tr('hat ein konkretes Ergebnis und ein Ende. Fortschritt sind <b>erledigte Aufgaben</b>, optional mit Enddatum. Es hat eine eigene Seite mit Notizen, Links und allen Aufgaben, kann „warten“ und wird am Ende abgeschlossen.','has a concrete result and an end. Progress means <b>completed tasks</b>, optionally with an end date. It has its own page with notes, links and all tasks, can be “waiting” and is completed at the end.')}<br><i>${tr('z. B. Website-Relaunch, Umzug, Halbmarathon im April, Steuererklärung','e.g. website relaunch, moving house, half marathon in April, tax return')}</i></div>
<div style="margin-top:10px">${tr('Eher nicht: „Gesund sein“ (zu vage), „Arbeit“ (zu allgemein). Weniger ist mehr.','Rather not: “Be healthy” (too vague), “Work” (too broad). Less is more.')}</div></div></details>`}
  <form id="goal-form" data-g="${g?g.id:''}" data-kind="${isProj(g)?'project':'goal'}">
  <div class="seg kindseg"><label><input type="radio" name="kind" value="goal" ${isProj(g)?'':'checked'}><span>${tr('Ziel','Goal')}<small>${tr('laufend','ongoing')}</small></span></label><label><input type="radio" name="kind" value="project" ${isProj(g)?'checked':''}><span>${tr('Projekt','Project')}<small>${tr('mit Ende','with an end')}</small></span></label></div>
  <label>${tr('Name','Name')}</label><input name="name" required maxlength="60" placeholder="${tr('z. B. Halbmarathon laufen','e.g. Run a half marathon')}" value="${g?esc(g.name):''}">
  <label>${tr('Warum ist dir das wichtig? (optional)','Why does this matter to you? (optional)')}</label><input name="why" maxlength="140" placeholder="${tr('z. B. Mehr Energie für den Alltag','e.g. More energy for everyday life')}" value="${g?esc(g.why||''):''}"><div class="small" style="margin-top:6px">${tr('Ein kurzer Satz in deinen Worten. Er steht später unter dem Ziel und erinnert dich daran, wofür du die Zeit investierst.','A short sentence in your own words. It appears under the goal and reminds you what you invest the time for.')}</div>
  <div class="only-proj"><label>${tr('Ziel-Emoji am Ende des Weges','Emoji at the end of the path')}</label><div class="emojis">${PEMOJI.map(e=>`<label><input type="radio" name="emoji" value="${e}" ${(g&&g.emoji?g.emoji:'🏁')===e?'checked':''}><span>${e}</span></label>`).join('')}<input name="emoji_own" class="emoji-own" maxlength="8" placeholder="${tr('eigenes','own')}" value="${g&&g.emoji&&!PEMOJI.includes(g.emoji)?esc(g.emoji):''}"></div><label>${tr('Geplantes Ende (optional)','Planned end (optional)')}</label><input name="due" type="date" value="${g&&g.due?g.due:''}"></div>
  <label>${tr('Stunden pro Woche (optional)','Hours per week (optional)')}</label><input name="target" type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="${tr('z. B. 5','e.g. 5')}" value="${g&&g.target?g.target:''}"><div class="small" style="margin-top:6px">${tr('Wie viele Stunden willst du pro Woche hineinstecken? Leer lassen, wenn du kein festes Wochenziel willst. Gemessen wird dein Einsatz, nicht das Ergebnis.','How many hours a week do you want to put in? Leave empty if you don’t want a fixed weekly target. Your effort is measured, not the result.')}</div>
  <label>${tr('Farbe','Colour')}</label><div class="colors">${COLORS.map(c=>`<button type="button" data-a="color" data-c="${c}" class="${c===editColor?'on':''}" style="background:${c}"></button>`).join('')}<label class="cpick ${COLORS.includes(editColor)?'':'on'}" title="${tr('Eigene Farbe','Custom colour')}" style="${COLORS.includes(editColor)?'':'background:'+editColor}"><input type="color" value="${/^#[0-9a-f]{6}$/i.test(editColor)?editColor:'#888888'}" data-cpick><span>+</span></label></div>
  <div class="actions">${g?`<button type="button" class="btn ghost" data-a="archive" data-g="${g.id}">${g.archived?tr('Reaktivieren','Reactivate'):tr('Archivieren','Archive')}</button><button type="button" class="btn danger" data-a="ask-del-goal" data-g="${g.id}">${tr('Löschen','Delete')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn" type="submit">${tr('Speichern','Save')}</button></div></form>`);
}
let MN=null;
function manualModal(gid,entryId){
  if(entryId){const e=(S.manual||[]).find(x=>x.id===entryId);if(!e)return;MN={id:e.id,g:e.g,day:e.day,min:Math.round(e.secs/60),note:e.note||''};}
  else MN={id:null,g:gid||(activeGoals()[0]||{}).id||'_none',day:todayKey(),min:30,note:''};
  renderManual();
}
function readManual(){const f=$('#manual-form');if(!f)return;const m=parseInt(f.querySelector('[name=min]').value,10);if(m>0)MN.min=m;MN.note=f.querySelector('[name=note]').value;const d=f.querySelector('[name=day]').value;if(d)MN.day=d;}
function renderManual(){
  const tk=todayKey(),gs=activeGoals();
  const dayChip=(k,l)=>`<button type="button" class="${MN.day===k?'on':''}" data-a="mn-day" data-v="${k}">${l}</button>`;
  const minChip=m=>`<button type="button" class="${MN.min===m?'on':''}" data-a="mn-min" data-v="${m}">${m<60?m+' min':(m/60)+' h'}</button>`;
  modal(`<h3>${MN.id?tr('Eintrag bearbeiten','Edit entry'):tr('Zeit nachtragen','Add time')}</h3>
  <form id="manual-form">
  <label>${tr('Ziel','Goal')}</label><div class="seg wrapseg">${gs.map(g=>`<button type="button" class="${MN.g===g.id?'on':''}" data-a="mn-goal" data-v="${g.id}"><i class="dot" style="background:${g.color};display:inline-block;margin-right:6px"></i>${esc(g.name)}</button>`).join('')}</div>
  <label>${tr('Tag','Day')}</label><div class="seg wrapseg">${dayChip(tk,tr('Heute','Today'))}${dayChip(shiftKey(tk,-1),tr('Gestern','Yesterday'))}${dayChip(shiftKey(tk,-2),tr('Vorgestern','2 days ago'))}</div>
  <input name="day" type="date" value="${MN.day}" max="${tk}" style="margin-top:8px">
  <label>${tr('Dauer','Duration')}</label><div class="seg wrapseg">${[15,30,45,60,90].map(minChip).join('')}</div>
  <div class="row" style="margin-top:8px"><input name="min" type="number" min="1" max="1440" inputmode="numeric" value="${MN.min}" style="width:110px"><span class="small">${tr('Minuten','minutes')}</span></div>
  <label>${tr('Notiz (optional)','Note (optional)')}</label><input name="note" maxlength="80" placeholder="${tr('z. B. Lauf 10 km','e.g. 10 km run')}" value="${esc(MN.note)}">
  <div class="actions">${MN.id?`<button type="button" class="btn danger" data-a="mn-del">${tr('Löschen','Delete')}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn" type="submit">${MN.id?tr('Speichern','Save'):tr('Eintragen','Add')}</button></div></form>`);
}
function addManual(g,day,secs,note){const e={id:uid(),g,day,secs,note:note||'',at:Date.now()};S.manual=S.manual||[];S.manual.push(e);checkMilestones();save();render();return e;}

// ================= Ereignisse =================
let prevTab='heute';
function setTab(t){if(t==='einstellungen'&&tab==='einstellungen'){t=prevTab;}if((t==='einstellungen'||t==='hilfe')&&tab!=='einstellungen'&&tab!=='hilfe')prevTab=tab;tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);if(t==='woche'){const c=$('#col-today');if(c&&window.innerWidth<820)c.scrollIntoView({inline:'start',block:'nearest'});}}
const EXTRA_ACTIONS={};
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){setTab(nb.dataset.tab);return;}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,gid=el.dataset.g,tid=el.dataset.t;
  if(a==='close-bg'&&e.target!==el)return;
  const tk=todayKey();
  const T=()=>S.tasks.find(x=>x.id===tid);
  switch(a){
    case 'tab':setTab(el.dataset.tab);break;
    case 'gpick':goalPicker(el.closest('form'));break;
    case 'gpick-set':{const v=el.dataset.v;lastGoal=v;if(pickForm&&document.body.contains(pickForm)){const inp=pickForm.querySelector('.add-goal');if(inp)inp.value=v;const b=pickForm.querySelector('.gpick');const g=goal(v)||NONE();if(b){b.querySelector('i').style.background=g.color;b.querySelector('span').textContent=g.name;}const ti=pickForm.querySelector('input:not([type=hidden])');closeModal();if(ti&&!ti.value)ti.focus();}else closeModal();break;}
    case 'back':setTab(tab==='hilfe'?'einstellungen':prevTab);break;
    case 'play':if(longRun(()=>startTimer(tid)))break;startTimer(tid);break;
    case 'stop':if(longRun(()=>stopTimer()))break;stopTimer();break;
    case 'focus-go':{const n=focusQueue()[0];if(n){S.running={goalId:n.goalId,taskId:n.id,start:Date.now()};save();}setTab('fokus');break;}
    case 'done':{const t=T();if(t&&!(S.running&&S.running.taskId===tid)&&t.date&&t.date<todayKey()){doneWhen(tid);break;}if(S.running&&S.running.taskId===tid&&longRun(()=>completeTask(tid,false)))break;completeTask(tid,false);break;}
    case 'focus-done':if(S.running&&S.running.taskId===tid&&longRun(()=>completeTask(tid,true)))break;completeTask(tid,true);break;
    case 'reopen':if($('#te-form'))closeModal();reopenTask(tid);break;
    case 'later':{const t=T();if(!t)break;if(S.meta.focusPin===tid)delete S.meta.focusPin;if(S.running&&S.running.taskId===tid)stopTimer(true);t.date=t.date<tk?tk:t.date;t.order=nextOrder(tk);save();render();break;}
    case 'up':case 'down':{const all=dayTasks(tk);const list=el.dataset.list==='o'?all.filter(t=>!isGoalTask(t)):all.filter(isGoalTask);moveInList(tid,a==='up'?-1:1,list);break;}
    case 'del-task':askDelTask(tid,false);break;
    case 'del-task-ok':doDelTask(tid);break;
    case 'move':{const t=T();if(!t)break;const nk=shiftKey(t.date<tk?tk:t.date,+el.dataset.d);t.date=nk;t.order=nextOrder(nk);save();render();break;}
    case 'to-ablage':{const t=T();if(!t)break;if(S.running&&S.running.taskId===tid)stopTimer(true);t.date=null;t.order=nextOrder(null);save();render();toast(tr('In die Ablage gelegt','Moved to backlog'));break;}
    case 'to-today':{const t=T();if(!t)break;t.date=tk;t.order=nextOrder(tk);save();render();toast(tr('Für heute eingeplant','Planned for today'));break;}
    case 'goto-ablage':tab='woche';weekOff=0;render();window.scrollTo(0,0);{const c=$('#col-ablage');if(c)c.scrollIntoView({inline:'start',block:'nearest'});}break;
    case 'toggle-other':showOther=!showOther;render();break;
    case 'week':weekOff=+el.dataset.d===0?0:weekOff+(+el.dataset.d);render();break;
    case 'rev':revOff=+el.dataset.d===0?0:Math.min(0,revOff+(+el.dataset.d));render();break;
    case 'review-go':revOff=weekOffsetOf(el.dataset.w);setTab('rueckblick');break;

function nedCmd(btn){
  const ed=btn.closest('.ned'),body=ed.querySelector('.nedit');body.focus();
  const s=getSelection();if(nedRange&&body.contains(nedRange.startContainer)){s.removeAllRanges();s.addRange(nedRange);}else if(!body.contains(s.anchorNode)){const r=document.createRange();r.selectNodeContents(body);r.collapse(false);s.removeAllRanges();s.addRange(r);}
  try{document.execCommand('defaultParagraphSeparator',false,'p');}catch(e){}
  const c=btn.dataset.cmd,an=s.anchorNode;
  if(c==='bold'||c==='italic')document.execCommand(c);
  else if(c==='strike')document.execCommand('strikeThrough');
  else if(c==='h'){const h=closestIn(an,'h3',body);document.execCommand('formatBlock',false,h?'p':'h3');}
  else if(c==='ul'||c==='ol'||c==='ck'){const li=closestIn(an,'li',body);const list=li&&li.parentElement;
    if(list){const isCk=list.tagName==='UL'&&list.classList.contains('ck'),cur=isCk?'ck':list.tagName.toLowerCase();
      if(cur===c){[...list.children].forEach(x=>{const p=document.createElement('p');while(x.firstChild)p.append(x.firstChild);if(!p.firstChild)p.innerHTML='<br>';list.before(p);});list.remove();}
      else{const nl=document.createElement(c==='ol'?'ol':'ul');if(c==='ck')nl.className='ck';while(list.firstChild){const x=list.firstChild;if(c!=='ck')x.removeAttribute&&x.removeAttribute('data-c');nl.append(x);}list.replaceWith(nl);caretIn(li,true);}}
    else makeList(body,c==='ol'?'ol':'ul',c==='ck');}
  else if(c==='link'){const sel=s.toString().trim();let u=prompt(tr('Adresse des Links','Link address'),/^\S+\.\S+$/.test(sel)?sel:'https://');if(u&&u.trim()&&u.trim()!=='https://'){u=u.trim();if(!/^(https?:|mailto:)/i.test(u))u=(/@/.test(u)?'mailto:':'https://')+u;body.focus();if(nedRange){s.removeAllRanges();s.addRange(nedRange);}if(sel)document.execCommand('createLink',false,u);else document.execCommand('insertHTML',false,`<a href="${esc(u)}">${esc(u.replace(/^(https?:\/\/|mailto:)/,''))}</a>&nbsp;`);}}
  else if(c==='hr')document.execCommand('insertHorizontalRule');
  nedSchedule(body);
}

  if(e.inputType==='insertText'&&e.data===' '){const s=getSelection(),an=s.anchorNode;const blk=closestIn(an,'p,li,h3,div',b)||b;const txt=(an&&an.nodeType===3?an.nodeValue:'')||'';const before=txt.slice(0,s.anchorOffset);
    const m=before.match(/^\s*(\[\s?\]|[-*•]|1\.)\s$/);if(m&&!closestIn(an,'ul,ol',b)&&an.nodeType===3&&an===(blk.firstChild||an)){an.nodeValue=txt.slice(before.length);const r=document.createRange();r.setStart(an,0);r.collapse(true);s.removeAllRanges();s.addRange(r);
      makeList(b,m[1]==='1.'?'ol':'ul',m[1].startsWith('['));}}

  if(e.key==='Enter'&&!e.shiftKey){const li=closestIn(getSelection().anchorNode,'li',b);if(li&&!li.textContent.trim()&&!li.querySelector('ul,ol')){e.preventDefault();exitList(li,b);nedSchedule(b);return;}}

const TLDS='de|com|net|org|io|at|ch|eu|app|dev|co|uk|info|me|ai|gg|tv|fm|ly|so|to|nl|fr|it|es|pl|be|dk|se|no|fi|cz|us|ca|au|jp|cloud|page|site|online|shop|tech|xyz|link|li|lu|ms|email|team|tools|work|biz|news|blog|berlin|hamburg|koeln|bayern|wien|swiss';
const LINK_RE=new RegExp(`(https?:\\/\\/[^\\s<>"']+|www\\.[^\\s<>"']+|[\\w.+-]+@[\\w-]+(?:\\.[\\w-]+)*\\.(?:[a-z]{2,24})\\b|(?<![\\w@.\\/-])(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+(?:${TLDS})\\b(?:[\\/?#][^\\s<>"']*)?)`,'gi');
function trimUrl(u){let s=u.replace(/[.,;:!?…»“”"']+$/,'');while(s.endsWith(')')&&(s.match(/\(/g)||[]).length<(s.match(/\)/g)||[]).length)s=s.slice(0,-1);return s;}
function linkInfo(raw){
  const r=trimUrl(raw);let href=r,mail=false;
  if(/^[\w.+-]+@/.test(r)&&!/^https?:/i.test(r)){href='mailto:'+r;mail=true;}
  else if(!/^https?:\/\//i.test(r))href='https://'+r;
  if(mail)return {raw:r,href,host:'',label:r,mail:true};
  let u;try{u=new URL(href);}catch(e){return null;}
  const host=u.hostname.replace(/^www\./,'').toLowerCase(),p=u.pathname,full=u.href;
  const seg=p.split('/').filter(Boolean);let label=host;
  const is=(...h)=>h.some(x=>host===x||host.endsWith('.'+x));
  if(is('outlook.office.com','outlook.office365.com','outlook.live.com'))label=/calendar/.test(p)?tr('Outlook-Termin','Outlook event'):tr('Outlook-Mail','Outlook mail');
  else if(is('teams.microsoft.com','teams.live.com','teams.cloud.microsoft'))label=/meetup-join|meet/.test(p)?tr('Teams-Meeting','Teams meeting'):/message|chat/.test(p)?tr('Teams-Nachricht','Teams message'):'Teams';
  else if(host==='mail.google.com')label='Gmail';
  else if(host==='calendar.google.com')label=tr('Google Kalender','Google Calendar');
  else if(host==='docs.google.com')label=/spreadsheets/.test(p)?'Google Sheet':/presentation/.test(p)?'Google Slides':/forms/.test(p)?'Google Form':'Google Doc';
  else if(host==='drive.google.com')label='Google Drive';
  else if(/-my\.sharepoint\.com$/.test(host)||is('onedrive.live.com','1drv.ms'))label='OneDrive';
  else if(is('sharepoint.com'))label='SharePoint';
  else if(is('github.com','codeberg.org','gitlab.com'))label=(host.split('.')[0].replace(/^./,c=>c.toUpperCase()).replace('Github','GitHub').replace('Gitlab','GitLab'))+(seg.length>=2?' · '+seg[0]+'/'+seg[1]:'')+(/\/(issues|pull|pulls|merge_requests)\/(\d+)/.test(p)?' #'+p.match(/\/(issues|pull|pulls|merge_requests)\/(\d+)/)[2]:'');
  else if(is('atlassian.net'))label=(p.match(/\/browse\/([A-Z][A-Z0-9]+-\d+)/)||[])[1]||(/wiki/.test(p)?'Confluence':'Jira');
  else if(is('notion.so','notion.site'))label='Notion';
  else if(is('trello.com'))label='Trello';
  else if(is('figma.com'))label='Figma';
  else if(is('miro.com'))label='Miro';
  else if(is('youtube.com','youtu.be'))label='YouTube';
  else if(is('dropbox.com'))label='Dropbox';
  else if(is('zoom.us'))label='Zoom';
  else if(is('businesscentral.dynamics.com'))label='Business Central';
  else if(is('dev.azure.com','visualstudio.com'))label=(p.match(/_workitems\/edit\/(\d+)/)||[])[1]?'Azure DevOps #'+p.match(/_workitems\/edit\/(\d+)/)[1]:'Azure DevOps';
  else if((host==='google.com'||host.startsWith('google.'))&&/^\/maps/.test(p)||host==='maps.app.goo.gl')label=tr('Karte','Map');
  return {raw:r,href:full,host,label,mail:false};
}
function extractLinks(...texts){const out=[],seen=new Set();for(const t of texts){if(!t)continue;for(const m of String(t).matchAll(LINK_RE)){const li=linkInfo(m[0]);if(li&&!seen.has(li.href)){seen.add(li.href);out.push(li);}}}return out;}

  if(li.mail)return `<span class="lk-ic lk-m">✉</span>`;
  const letter=esc((li.host.replace(/^(www|mail|docs|app|my)\./,'')[0]||'?').toUpperCase());
  return `<span class="lk-ic"><b>${letter}</b>${favOn()?`<img src="https://icons.duckduckgo.com/ip3/${esc(li.host)}.ico" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" onload="if(this.naturalWidth<2)this.remove()">`:''}</span>`;
}

function linkRow(t,max){const ls=extractLinks(t.title,notePlain(t.notes));if(!ls.length)return '';const shown=max&&ls.length>max?ls.slice(0,max-1):ls;return `<div class="lkrow" data-lk-for="${t.id}">${shown.map(linkChip).join('')}${shown.length<ls.length?`<button class="lk lk-more" data-a="edit-task" data-t="${t.id}">+${ls.length-shown.length}</button>`:''}</div>`;}

// ================= Schnell erfassen & Aufgabe bearbeiten =================
const WD_NAMES=[['sonntag','sunday','so','sun'],['montag','monday','mo','mon'],['dienstag','tuesday','di','tue'],['mittwoch','wednesday','mi','wed'],['donnerstag','thursday','do','thu'],['freitag','friday','fr','fri'],['samstag','saturday','sa','sat']];
function dayWord(w){
  const raw=String(w).trim();w=w.toLowerCase().replace(/[.,;!]+$/,'');const tk=todayKey();
  if(w==='heute'||w==='today')return tk;
  if(w==='morgen'||w==='tomorrow')return shiftKey(tk,1);
  if(w==='übermorgen'||w==='uebermorgen')return shiftKey(tk,2);
  if(w==='ablage'||w==='backlog'||w==='später'||w==='later')return null;
  const dm=raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})?$/);if(dm){let y=dm[3]?+dm[3]:new Date().getFullYear();if(y<100)y+=2000;const d=new Date(y,+dm[2]-1,+dm[1]);if(d.getMonth()!==+dm[2]-1||d.getDate()!==+dm[1])return undefined;return dkey(d);}
  const i=WD_NAMES.findIndex(n=>n.includes(w));
  if(i<0)return undefined;
  const now=parseKey(tk).getDay();return shiftKey(tk,(i-now+7)%7);
}
function goalWord(w){const n=w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');if(!n)return null;const gs=activeGoals();const key=g=>g.name.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');return gs.find(g=>key(g)===n)||gs.find(g=>key(g).startsWith(n))||null;}
// Zeile zerlegen: Aufzählungszeichen weg, #Ziel irgendwo, Tag nur am Zeilenende
function parseLine(line){
  let s=line.replace(/^\s*(?:[-*•–]\s*)?(?:\[[ xX]?\]\s*)?/,'').trim();let day,g,prio=0;const tags=[];
  // #Ziel/Projekt mit vollem Namen (auch mit Leerzeichen), längste Namen zuerst
  const gs=[...activeGoals()].sort((a,b)=>b.name.length-a.name.length);
  s=s.replace(/(^|\s)#(\S[^#]*)/gu,(m,sp,rest)=>{if(g)return m;const low=rest.toLowerCase();const hit=gs.find(x=>{const n=x.name.toLowerCase();return low.startsWith(n)&&(low.length===n.length||/[\s,;!]/.test(low[n.length]));});if(!hit)return m;g=hit.id;return sp+' '+rest.slice(hit.name.length);});
  s=s.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,(m,sp,w)=>{const x=goalWord(w);if(x&&!g){g=x.id;return sp;}const tg=normTag(w);if(tg&&!tags.includes(tg))tags.push(tg);return sp;}).replace(/\s{2,}/g,' ').trim();
  const take=(tok)=>{if(!prio&&/^!{1,3}$/.test(tok)){prio=tok.length;return true;}const d=dayWord(tok);if(d!==undefined&&day===undefined){day=d;return true;}return false;};
  for(let k=0;k<4;k++){ // Ende
    let m=s.match(/\S(!{2,3})$/);if(m&&!prio){prio=m[1].length;s=s.slice(0,s.length-m[1].length).trim();continue;}
    m=s.match(/(?:^|\s)(\S+)$/);if(!m||m.index===0&&!/\s/.test(s))break;if(!take(m[1]))break;s=s.slice(0,s.length-m[1].length).trim();}
  for(let k=0;k<4;k++){ // Anfang
    const m=s.match(/^(\S+)\s+/);if(!m)break;if(!take(m[1]))break;s=s.slice(m[0].length).trim();}
  return {title:s.slice(0,140),day,g,tags,prio};
}

function hashSugUpdate(el){let box=el.parentNode.querySelector('.hashsug');const pos=el.selectionStart||0,before=el.value.slice(0,pos);const m=before.match(/(^|\s)#([^#\n]*)$/);
  const q=m?m[2].toLowerCase().replace(/[^\p{L}\p{N}]/gu,''):null;const list=m?activeGoals().filter(g=>!q||g.name.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'').includes(q)).slice(0,6):[];
  if(!m||!list.length||(m[2].length>0&&list.some(g=>m[2].toLowerCase()===g.name.toLowerCase()))){if(box)box.remove();return;}
  if(!box){box=document.createElement('div');box.className='hashsug';el.after(box);}
  box.innerHTML=list.map(g=>`<button type="button" data-a="hash-pick" data-g="${g.id}"><span class="dot" style="background:${g.color}"></span>${esc(g.name)}<small>${isProj(g)?tr('Projekt','Project'):tr('Ziel','Goal')}</small></button>`).join('');}
function hashPick(btn){const box=btn.closest('.hashsug'),el=box.previousElementSibling;const g=goal(btn.dataset.g);if(!el||!g)return;const pos=el.selectionStart||el.value.length,before=el.value.slice(0,pos),after=el.value.slice(pos);const nb=before.replace(/(^|\s)#([^#\n]*)$/,(m,sp)=>sp+'#'+g.name+' ');el.value=nb+after.replace(/^\s+/,'');el.focus();el.setSelectionRange(nb.length,nb.length);box.remove();qcPreview(el);}
function qcPreview(el){const pv=el.closest('form')&&el.closest('form').querySelector('.qcpv');if(!pv)return;const lines=el.value.split('\n').filter(l=>l.trim());if(lines.length!==1){pv.innerHTML='';return;}const x=parseLine(lines[0]);const bits=[];
  if(x.day!==undefined&&x.day!==null)bits.push(`<span>📅 ${dayLabel(x.day)}</span>`);if(x.prio)bits.push(`<span class="prio">${'!'.repeat(x.prio)}</span>`);if(x.g){const gg=goal(x.g);bits.push(`<span><i class="dot" style="background:${gg.color}"></i>${esc(gg.name)}</span>`);}x.tags.forEach(t=>bits.push(`<span>#${esc(t)}</span>`));
  pv.innerHTML=bits.length?`<b>${esc(x.title)}</b>${bits.join('')}`:'';}
document.addEventListener('input',e=>{const el=e.target;if(el.matches&&el.matches('[data-hashsug]')){hashSugUpdate(el);qcPreview(el);}});

const QC={day:null,g:'_none',notes:''};
function quickAdd(text,notes){QC.day=null;QC.g='_none';QC.notes=notes||'';renderQC(text||'');}
function readQC(){const f=$('#qc-form');if(!f)return '';const n=f.querySelector('[name=n]');if(n)QC.notes=n.value;return f.querySelector('[name=t]').value;}
function dayLabel(k){if(k===null)return tr('Ablage','Backlog');const tk=todayKey();if(k===tk)return tr('heute','today');if(k===shiftKey(tk,1))return tr('morgen','tomorrow');return parseKey(k).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'numeric'});}
function goalSeg(cur,act){return `<div class="seg wrapseg">${[...activeGoals(),NONE()].map(g=>`<button type="button" class="${cur===g.id?'on':''}" data-a="${act}" data-v="${g.id}"><i class="dot" style="background:${g.color};display:inline-block;margin-right:6px"></i>${esc(g.name)}</button>`).join('')}</div>`;}
function daySeg(cur,act){const tk=todayKey();const o=[['',tr('Ablage','Backlog')],[tk,tr('Heute','Today')],[shiftKey(tk,1),tr('Morgen','Tomorrow')]];const known=o.some(x=>x[0]===(cur||''));
  return `<div class="seg wrapseg">${o.map(([k,l])=>`<button type="button" class="${(cur||'')===k?'on':''}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}<input type="date" class="segdate ${known?'':'on'}" data-a-date="${act}" value="${known?'':cur}" ${act==='qc-day'?`min="${tk}"`:''}></div>`;}

function saveQC(){
  const text=readQC();const lines=text.split('\n').map(parseLine).filter(x=>x.title);

  const ids=[];
  for(const x of lines){const k=x.day!==undefined?x.day:QC.day;const t={id:uid(),goalId:x.g||QC.g||'_none',title:x.title,date:k,done:false,secs:0,order:nextOrder(k)};if(x.tags.length)t.tags=x.tags;if(x.prio)t.prio=x.prio;if(lines.length===1&&QC.notes.trim())t.notes=QC.notes.trim().slice(0,4000);S.tasks.push(t);ids.push(t.id);if(t.goalId==='_none'&&k===todayKey())showOther=true;}

// Geteilte Inhalte und Links: ?add=… (Lesezeichen, Kurzbefehl) oder Teilen-Menü (title/text/url)
function takeShared(){
  const q=new URLSearchParams(location.search);
  if(!['add','title','text','url'].some(k=>q.has(k)))return;
  const add=(q.get('add')||'').trim(),title=(q.get('title')||'').trim(),text=(q.get('text')||'').trim(),url=(q.get('url')||'').trim();
  ['add','title','text','url','share'].forEach(k=>q.delete(k));
  try{history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);}catch(e){}
  let first='',notes=[];
  if(add){const ls=add.split('\n');first=add;if(ls.length>8){first=ls[0];notes.push(ls.slice(1).join('\n'));}}
  else{const ls=text.split('\n').map(l=>l.trim()).filter(Boolean);first=title||ls.shift()||url;if(title)notes.push(text);else notes.push(ls.join('\n'));if(url&&url!==first)notes.push(url);}
  setTimeout(()=>quickAdd(first.trim(),notes.filter(Boolean).join('\n\n')),150);
}

  document.querySelectorAll('[data-clock]').forEach(c=>c.textContent=fmtClock(runningSecs()));

  document.querySelectorAll('[data-live-focus]').forEach(tl=>{const t=S.tasks.find(x=>x.id===tl.dataset.liveFocus);if(t)tl.textContent=fmtClock(taskSecs(t));});

const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64url(crypto.getRandomValues(new Uint8Array(n)));
async function pkce(){const v=rnd(48);const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));return {v,ch};}
async function startAuth(p,silent){
  const cid=clientId(p);if(!cid)return wizardOpen(p);
  const state=rnd(16);const st={p,state,silent:!!silent,at:Date.now(),tab};
  let u;
  if(p==='dropbox'){const k=await pkce();st.v=k.v;u=new URL('https://www.dropbox.com/oauth2/authorize');Object.entries({client_id:cid,response_type:'code',code_challenge:k.ch,code_challenge_method:'S256',redirect_uri:redirectUri(),token_access_type:'offline',state}).forEach(([a,b])=>u.searchParams.set(a,b));}
  else if(p==='onedrive'){const k=await pkce();st.v=k.v;u=new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');Object.entries({client_id:cid,response_type:'code',redirect_uri:redirectUri(),scope:'Files.ReadWrite.AppFolder offline_access',code_challenge:k.ch,code_challenge_method:'S256',state}).forEach(([a,b])=>u.searchParams.set(a,b));if(silent)u.searchParams.set('prompt','none');}

async function formPost(url,params){

}
async function finishAuth(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));
  const src=q.has('code')||q.has('error')?q:(h.has('access_token')||h.has('error'))?h:null;
  if(!src)return false;
  let st=null;try{st=JSON.parse(localStorage.getItem(OAUTH_KEY)||'null');}catch(e){}
  localStorage.removeItem(OAUTH_KEY);
  history.replaceState(null,'',location.pathname+(st&&st.tab?'#'+st.tab:''));
  if(st&&st.tab&&TABS.includes(st.tab))tab=st.tab;
  if(!st||src.get('state')!==st.state){SY.err=tr('Anmeldung konnte nicht zugeordnet werden. Bitte nochmal versuchen.','Sign-in could not be matched. Please try again.');return true;}
  if(src.has('error')){
    if(st.silent){SY.needsAuth=true;return true;}
    SY.err=tr('Anmeldung abgebrochen','Sign-in cancelled');return true;
  }
  const p=st.p,cid=clientId(p),prev=SY.cfg.type===p?SY.cfg:{};

  else if(p==='onedrive'){const t=await formPost('https://login.microsoftonline.com/common/oauth2/v2.0/token',{client_id:cid,grant_type:'authorization_code',code:src.get('code'),redirect_uri:redirectUri(),code_verifier:st.v,scope:'Files.ReadWrite.AppFolder offline_access'});SY.cfg={type:p,refresh:t.refresh_token,access:t.access_token,exp:Date.now()+(t.expires_in-60)*1000};}
  else if(p==='google'){SY.cfg={type:p,access:src.get('access_token'),exp:Date.now()+((+src.get('expires_in')||3600)-60)*1000,fileId:prev.fileId};}

async function accessToken(){
  const c=SY.cfg,cid=clientId(c.type);
  if(c.type==='pcloud')return c.access;
  if(c.access&&(!c.exp||c.exp>Date.now()))return c.access;
  if(c.type==='google')throw new AuthError('expired');
  try{
    const url=c.type==='dropbox'?'https://api.dropboxapi.com/oauth2/token':'https://login.microsoftonline.com/common/oauth2/v2.0/token';
    const params=c.type==='dropbox'?{grant_type:'refresh_token',refresh_token:c.refresh,client_id:cid}:{grant_type:'refresh_token',refresh_token:c.refresh,client_id:cid,scope:'Files.ReadWrite.AppFolder offline_access'};
    const t=await formPost(url,params);
    c.access=t.access_token;c.exp=Date.now()+(t.expires_in-60)*1000;if(t.refresh_token)c.refresh=t.refresh_token;saveCfg();return c.access;
  }catch(e){if(e instanceof AuthError)throw e;throw e;}
}
async function api(url,opt){
  opt=opt||{};const tok=await accessToken();
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+tok})}));
  if(r.status===401){if(SY.cfg.type!=='pcloud'){SY.cfg.access=null;SY.cfg.exp=0;saveCfg();}throw new AuthError('401');}
  return r;
}

async function syncPull(){
  const p=provider();if(!p||SY.busy||SY.needsAuth)return;
  SY.busy=true;SY.err=null;showSync();
  try{
    const remote=await p.get();
    const mine=localStamp();
    const hasLocal=S.goals.length||S.tasks.length;
    if(!SY.cfg.synced&&remote&&remote.state&&hasLocal&&(remote.state.goals||[]).length){
      SY.busy=false;SY.pendingRemote=remote;showSync();
      modal(`<h3>${tr('Welche Daten behalten?','Which data should be kept?')}</h3><div class="small" style="line-height:1.5">${tr(`In ${provName()} liegen schon Motus-Daten (${remote.state.goals.length} Ziele, ${(remote.state.tasks||[]).length} Aufgaben), und auf diesem Gerät auch (${S.goals.length} Ziele, ${S.tasks.length} Aufgaben). Welche sollen ab jetzt gelten?`,`${provName()} already has Motus data (${remote.state.goals.length} goals, ${(remote.state.tasks||[]).length} tasks), and so does this device (${S.goals.length} goals, ${S.tasks.length} tasks). Which should apply from now on?`)}</div><div class="actions"><button class="btn ghost" data-a="sync-keep-local">${tr('Dieses Gerät','This device')}</button><span class="sp"></span><button class="btn" data-a="sync-keep-remote">${tr('Aus ','From ')}${provName()}</button></div>`);
      return;
    }
    if(remote&&remote.state&&(remote.savedAt||0)>mine){
      S=normalize(remote.state);localSave();setStamp(remote.savedAt);applyTheme();softRender();
    }else if(!remote||(remote.savedAt||0)<mine){
      await p.put(JSON.stringify({app:'motus',v:3,savedAt:mine||Date.now(),state:S}));
      if(!mine)setStamp(Date.now());
    }
    SY.last=Date.now();if(!SY.cfg.synced){SY.cfg.synced=true;saveCfg();}
  }catch(e){handleErr(e);}
  SY.busy=false;showSync();if(tab==='einstellungen'&&!typing())render();
}
async function syncPush(){
  const p=provider();if(!p||SY.needsAuth)return;
  if(SY.busy){schedulePush();return;}
  SY.busy=true;SY.err=null;showSync();
  try{await p.put(JSON.stringify({app:'motus',v:3,savedAt:localStamp(),state:S}));SY.last=Date.now();}
  catch(e){handleErr(e);}
  SY.busy=false;showSync();
}
function schedulePush(){if(SY.cfg.type==='none')return;clearTimeout(SY.timer);SY.timer=setTimeout(()=>{SY.timer=null;syncPush();},2000);}
function markDirty(){setStamp(Date.now());schedulePush();}
async function syncInit(){
  try{await finishAuth();}catch(e){SY.err=errText(e);}
  showSync();render();
  if(SY.cfg.type!=='none'){
    if(SY.cfg.type==='google'&&!(SY.cfg.access&&SY.cfg.exp>Date.now())){SY.needsAuth=true;showSync();maybeSilentAuth();}
    else syncPull();
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SY.timer){clearTimeout(SY.timer);SY.timer=null;syncPush();}}else syncPull();});
  window.addEventListener('online',syncPull);
  setInterval(()=>{if(!document.hidden&&!SY.timer)syncPull();},120000);
}

  if(WZ.step===0)return modal(`<h3>${tr('Mit','Connect')} ${name}${tr(' verbinden','')}</h3><div class="small" style="line-height:1.55">${tr(`Motus speichert eine einzige Datei <b>motus.json</b> ${where}. Auf deine anderen Dateien hat Motus keinen Zugriff. Du wirst gleich zu ${name} weitergeleitet, meldest dich an, bestätigst und landest wieder hier.`,`Motus saves a single file <b>motus.json</b> ${where}. Motus has no access to your other files. You’ll be taken to ${name}, sign in, confirm and land back here.`)}${p==='google'?'<br><br>'+tr('Hinweis: Google erlaubt Web-Apps nur kurze Anmeldungen. Motus meldet sich deshalb ab und zu im Hintergrund neu an.','Note: Google only allows short sign-ins for web apps, so Motus re-signs in in the background now and then.'):''}${p==='onedrive'?'<br><br>'+tr('Hinweis: Microsoft erneuert die Anmeldung einmal am Tag. Meist merkst du davon nur ein kurzes Neuladen.','Note: Microsoft renews the sign-in once a day. Usually you just notice a quick reload.'):''}</div>${secure?'':`<div class="hint" style="margin-top:10px;color:var(--danger)">${tr('Das funktioniert nur, wenn Motus über https:// läuft.','This only works when Motus runs over https://.')}</div>`}
    <div class="actions">${CLOUD_IDS[p]?'':`<button class="btn ghost" data-a="wz-goto" data-v="1">${tr('Client-ID ändern','Change client ID')}</button>`}<span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn gold" data-a="wz-auth" ${secure?'':'disabled'}>${tr('Weiter zu','Continue to')} ${name}</button></div>`);
  return modal(`${steps(2,0)}<h3>${tr('Einmalige Einrichtung','One-time setup')}: ${name}</h3><div class="small" style="line-height:1.55">${tr(`Motus muss einmalig bei ${name} angemeldet werden. Das ist kostenlos und dauert ein paar Minuten, am besten am Computer. Danach kannst du dich auf allen Geräten einfach mit ${name} anmelden.`,`Motus needs to be registered with ${name} once. It’s free and takes a few minutes, best done on a computer. After that you can simply sign in with ${name} on all devices.`)}</div>
    ${devGuide(p)}
    <form id="cid-form"><label>${p==='dropbox'?'App key':'Client ID'}</label><input name="cid" required autocomplete="off" value="${esc(clientId(p))}">
    <div class="actions"><span class="sp"></span><button type="button" class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn gold" type="submit">${tr('Speichern & anmelden','Save & sign in')}</button></div></form>`);
}
Object.assign(EXTRA_ACTIONS,{
  'wz-start'(el){wizardOpen(el.dataset.v);},
  'wz-goto'(el){WZ.step=+el.dataset.v;wizard();},
  'wz-auth'(){startAuth(WZ.p,false);},
  async 'wz-copy'(el){try{await navigator.clipboard.writeText(el.dataset.v);toast(tr('Kopiert','Copied'));}catch(e){toast(tr('Bitte von Hand kopieren','Please copy manually'));}},
  'sync-now'(){SY.err=null;syncPull();},
  'sync-reauth'(){startAuth(SY.cfg.type,false);},
  'sync-off'(){modal(`<h3>${tr('Synchronisierung trennen?','Disconnect sync?')}</h3><div class="small">${tr(`Deine Daten bleiben auf diesem Gerät und in der Datei bei ${provName()} erhalten. Es wird nur nicht mehr abgeglichen.`,`Your data stays on this device and in the file at ${provName()}. It just won’t be synced anymore.`)}</div><div class="actions"><span class="sp"></span><button class="btn ghost" data-a="close">${tr('Abbrechen','Cancel')}</button><button class="btn danger" data-a="sync-off-ok">${tr('Trennen','Disconnect')}</button></div>`);},
  'sync-off-ok'(){SY.cfg={type:'none'};SY.err=null;SY.last=null;SY.needsAuth=false;saveCfg();closeModal();showSync();render();},
  'sync-keep-remote'(){const r=SY.pendingRemote;SY.pendingRemote=null;if(r){S.running=null;S=normalize(r.state);localSave();setStamp(r.savedAt||Date.now());}SY.cfg.synced=true;saveCfg();closeModal();SY.last=Date.now();showSync();applyTheme();render();},
  'sync-keep-local'(){SY.pendingRemote=null;SY.cfg.synced=true;saveCfg();setStamp(Date.now());closeModal();syncPush().then(render);}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='cid-form'){e.preventDefault();e.stopImmediatePropagation();const v=new FormData(f).get('cid').trim();if(v){setClientId(WZ.p,v);startAuth(WZ.p,false);}}
},true);
// Hinweis bei abgelaufener Anmeldung, einmal pro Sitzung
let reauthHinted=false;
setInterval(()=>{if(SY.needsAuth&&!reauthHinted&&!document.hidden&&!$('#modal-root').innerHTML){reauthHinted=true;toast(`${tr(`${provName()}: Anmeldung abgelaufen`,`${provName()}: sign-in expired`)} · <button data-a="sync-reauth" style="text-decoration:underline;color:inherit;font-weight:600">${tr('Neu anmelden','Sign in')}</button>`,8000);}},5000);

initStore();
syncInit();
takeShared();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
